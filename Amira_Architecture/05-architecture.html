<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Amira platform architecture — how the system is built and operated.">
<meta name="color-scheme" content="light dark">
<title>Amira — Platform Architecture</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root {
  /* Light palette — warm off-white paper */
  --bg: #FAF8F3;
  --bg-alt: #F4EFE3;
  --surface: #FFFFFF;
  --surface-2: #F2EDE2;
  --border: #E2DBC9;
  --border-strong: #C9C0AB;
  --text: #1A1612;
  --text-muted: #5E574B;
  --text-subtle: #8A8276;
  --accent: #0F5560;
  --accent-hover: #0A3D45;
  --accent-soft: rgba(15, 85, 96, 0.07);
  --accent-line: rgba(15, 85, 96, 0.22);
  --code-bg: rgba(15, 85, 96, 0.06);
  --code-text: #2D2A24;
  --code-block-bg: #F4EFE3;
  --shadow-sm: 0 1px 2px rgba(26, 22, 18, 0.04);
  --shadow-md: 0 4px 16px rgba(26, 22, 18, 0.06);
  --shadow-lg: 0 10px 40px rgba(26, 22, 18, 0.10);

  /* Typography */
  --font-display: 'Inter Tight', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-body: 'Source Serif 4', 'Charter', 'Iowan Old Style', Georgia, serif;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;

  /* Sizing */
  --content-max: 760px;
  --content-wide-max: 1140px;
  --sidebar-w: 320px;

  /* Spacing scale */
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --s-7: 48px;
  --s-8: 64px;
  --s-9: 96px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14110D;
    --bg-alt: #1A1814;
    --surface: #1A1814;
    --surface-2: #211E18;
    --border: #2E2A21;
    --border-strong: #423D31;
    --text: #ECE6D9;
    --text-muted: #A39B8C;
    --text-subtle: #756E62;
    --accent: #6BC4D0;
    --accent-hover: #87D5E0;
    --accent-soft: rgba(107, 196, 208, 0.10);
    --accent-line: rgba(107, 196, 208, 0.28);
    --code-bg: rgba(107, 196, 208, 0.10);
    --code-text: #ECE6D9;
    --code-block-bg: #1F1C16;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
    --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
  }
}

* { box-sizing: border-box; }
*::selection { background: var(--accent-soft); color: var(--text); }

html { scroll-behavior: smooth; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'kern', 'liga', 'calt';
}

body {
  min-height: 100vh;
  background-image:
    radial-gradient(at 12% 8%, var(--accent-soft) 0%, transparent 35%),
    radial-gradient(at 88% 92%, var(--accent-soft) 0%, transparent 40%);
  background-attachment: fixed;
}

/* Scroll progress bar */
.progress {
  position: fixed;
  top: 0; left: 0;
  height: 2px;
  width: 0;
  background: var(--accent);
  z-index: 200;
  transition: width 0.05s linear;
  pointer-events: none;
}

/* ================== Layout ================== */
@media (min-width: 1024px) {
  body {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
  }
  .topbar { display: none; }
  .sidebar-overlay { display: none; }
  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    border-right: 1px solid var(--border);
    background: var(--bg);
  }
  .content {
    padding: var(--s-9) var(--s-8) var(--s-8);
    max-width: 1140px;
    width: 100%;
  }
}

@media (max-width: 1023px) {
  .topbar {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: var(--s-4);
    padding: var(--s-3) var(--s-4);
    background: rgba(250, 248, 243, 0.92);
    border-bottom: 1px solid var(--border);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
  }
  @media (prefers-color-scheme: dark) {
    .topbar { background: rgba(20, 17, 13, 0.92); }
  }
  .sidebar {
    position: fixed;
    top: 0; left: 0;
    z-index: 100;
    width: 88%;
    max-width: 360px;
    height: 100vh;
    overflow-y: auto;
    background: var(--bg);
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
    transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .sidebar.open {
    transform: translateX(0);
    box-shadow: var(--shadow-lg);
  }
  .sidebar-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 17, 13, 0.50);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.32s, visibility 0s 0.32s;
    z-index: 90;
    backdrop-filter: blur(2px);
  }
  .sidebar-overlay.open {
    opacity: 1;
    visibility: visible;
    transition: opacity 0.32s, visibility 0s 0s;
  }
  .content {
    padding: var(--s-6) var(--s-4) var(--s-9);
  }
}

/* ================== Topbar (mobile) ================== */
.menu-toggle {
  width: 36px;
  height: 36px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0;
  display: inline-flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.menu-toggle:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.menu-toggle span {
  display: block;
  width: 16px;
  height: 1.5px;
  background: var(--text);
}
.topbar-title {
  font-family: var(--font-ui);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--text);
  display: inline-flex;
  align-items: center;
  gap: var(--s-2);
}
.topbar-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  background: var(--text);
  color: var(--bg);
  border-radius: 5px;
  font-family: var(--font-display);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: -0.04em;
}

/* ================== Sidebar / TOC ================== */
.sidebar-inner {
  padding: var(--s-7) var(--s-6);
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--s-2);
  margin-bottom: var(--s-7);
  padding-bottom: var(--s-5);
  border-bottom: 1px solid var(--border);
}
.brand-mark {
  width: 32px; height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--text);
  color: var(--bg);
  border-radius: 7px;
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.04em;
  margin-bottom: var(--s-2);
}
.brand-name {
  font-family: var(--font-display);
  font-size: 19px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.025em;
  line-height: 1.1;
}
.brand-tag {
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--text-subtle);
}

.toc {
  font-family: var(--font-ui);
  font-size: 13.5px;
  flex: 1;
}
.toc-label {
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  color: var(--text-subtle);
  margin-bottom: var(--s-3);
}
.toc ul {
  list-style: none;
  margin: 0;
  padding: 0;
}
.toc-h2 {
  margin: 0;
}
.toc-h2 > a {
  display: flex;
  align-items: baseline;
  gap: var(--s-2);
  padding: 7px var(--s-3) 7px var(--s-3);
  margin-left: -1px;
  color: var(--text);
  text-decoration: none;
  font-weight: 500;
  letter-spacing: -0.005em;
  border-left: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
  border-radius: 0 4px 4px 0;
}
.toc-h2 > a:hover {
  color: var(--accent);
  background: var(--accent-soft);
}
.toc-h2.active > a {
  color: var(--accent);
  border-left-color: var(--accent);
  font-weight: 600;
}
.toc-num {
  display: inline-block;
  min-width: 28px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-subtle);
  font-weight: 500;
  flex-shrink: 0;
  text-align: right;
  padding-right: 2px;
}
.toc-h2.active .toc-num {
  color: var(--accent);
}
.toc-text {
  flex: 1;
}

.toc-h2 > ul {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.toc-h2.active > ul,
.toc-h2.expanded > ul {
  max-height: 700px;
}
.toc-h3 a {
  display: block;
  padding: 5px 0 5px var(--s-7);
  color: var(--text-muted);
  text-decoration: none;
  font-size: 12.5px;
  border-left: 1px solid var(--border);
  margin-left: var(--s-3);
  transition: color 0.15s, border-color 0.15s;
  letter-spacing: -0.003em;
}
.toc-h3 a:hover {
  color: var(--accent);
}
.toc-h3.active > a {
  color: var(--accent);
  border-left-color: var(--accent);
}

.sidebar-footer {
  margin-top: var(--s-7);
  padding-top: var(--s-5);
  border-top: 1px solid var(--border);
  font-family: var(--font-ui);
  font-size: 11px;
  color: var(--text-subtle);
  letter-spacing: 0.02em;
  line-height: 1.5;
}

/* ================== Content / Prose ================== */
.content {
  margin: 0 auto;
}

.prose {
  max-width: var(--content-max);
  margin: 0 auto;
  font-family: var(--font-body);
  font-variation-settings: 'opsz' 22;
}

/* h1 — page title */
.prose h1 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(36px, 5.5vw, 56px);
  line-height: 1.04;
  letter-spacing: -0.028em;
  color: var(--text);
  margin: 0 0 var(--s-5);
}

/* The lead blockquote at the top */
.prose > blockquote:first-of-type {
  font-family: var(--font-body);
  font-style: normal;
  font-size: 19.5px;
  line-height: 1.55;
  color: var(--text-muted);
  border-left: 2px solid var(--accent-line);
  padding: 4px var(--s-4) 4px var(--s-5);
  margin: 0 0 var(--s-9);
  background: transparent;
  font-variation-settings: 'opsz' 20;
}
.prose > blockquote:first-of-type p {
  margin: 0 0 var(--s-3);
}
.prose > blockquote:first-of-type p:last-child {
  margin-bottom: 0;
}

/* Section h2 */
.prose h2 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(26px, 3vw, 34px);
  line-height: 1.15;
  letter-spacing: -0.022em;
  color: var(--text);
  margin: var(--s-9) 0 var(--s-5);
  padding-top: var(--s-6);
  position: relative;
  scroll-margin-top: 24px;
}
.prose h2::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 56px;
  height: 1px;
  background: var(--accent);
}

/* h3 */
.prose h3 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  line-height: 1.25;
  letter-spacing: -0.018em;
  color: var(--text);
  margin: var(--s-7) 0 var(--s-4);
  scroll-margin-top: 24px;
}

/* h4 */
.prose h4 {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.10em;
  color: var(--text);
  margin: var(--s-6) 0 var(--s-3);
}

/* h5 */
.prose h5 {
  font-family: var(--font-ui);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: -0.005em;
  color: var(--text);
  margin: var(--s-5) 0 var(--s-2);
}

.prose p {
  margin: 0 0 var(--s-4);
}
.prose ul, .prose ol {
  margin: 0 0 var(--s-4);
  padding-left: var(--s-5);
}
.prose li {
  margin-bottom: var(--s-2);
}
.prose li > p { margin-bottom: var(--s-2); }
.prose ul > li::marker {
  color: var(--accent);
}
.prose ol > li::marker {
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 0.85em;
}

.prose a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
  text-decoration-color: var(--accent-line);
  transition: text-decoration-color 0.15s;
}
.prose a:hover {
  text-decoration-color: var(--accent);
}

.prose strong {
  font-weight: 600;
  color: var(--text);
}
.prose em {
  font-style: italic;
}

.prose hr {
  border: 0;
  height: 1px;
  background: var(--border);
  margin: var(--s-7) 0;
  max-width: 220px;
  margin-left: 0;
}

/* Inline code */
.prose code:not(pre code) {
  font-family: var(--font-mono);
  font-size: 0.86em;
  padding: 2px 6px;
  background: var(--code-bg);
  color: var(--code-text);
  border-radius: 4px;
  font-weight: 400;
  font-feature-settings: 'liga' 0;
}

/* Code block */
.prose pre {
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.65;
  background: var(--code-block-bg);
  border: 1px solid var(--border);
  padding: var(--s-4) var(--s-5);
  border-radius: 8px;
  overflow-x: auto;
  margin: var(--s-5) 0;
}
.prose pre code {
  background: transparent;
  padding: 0;
  border: 0;
  white-space: pre;
  font-size: 13.5px;
}

/* Body blockquote */
.prose blockquote {
  border-left: 2px solid var(--accent-line);
  padding: 2px var(--s-4) 2px var(--s-5);
  margin: var(--s-5) 0;
  color: var(--text-muted);
  font-style: italic;
  font-size: 16.5px;
}

/* ================== Tables ================== */
.table-scroll {
  overflow-x: auto;
  margin: var(--s-5) 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
}
.prose table {
  width: 100%;
  border-collapse: collapse;
  font-family: var(--font-ui);
  font-size: 13.5px;
  line-height: 1.5;
  margin: 0;
}
.prose th {
  text-align: left;
  font-weight: 600;
  padding: var(--s-3) var(--s-4);
  border-bottom: 1.5px solid var(--text);
  color: var(--text);
  font-family: var(--font-ui);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  font-size: 11px;
  background: var(--surface-2);
  white-space: nowrap;
}
.prose td {
  padding: var(--s-3) var(--s-4);
  border-bottom: 1px solid var(--border);
  color: var(--text-muted);
  vertical-align: top;
}
.prose tr:last-child td { border-bottom: 0; }
.prose tbody tr:hover td {
  background: var(--surface-2);
  color: var(--text);
}
.prose td code {
  font-size: 12.5px;
  white-space: normal;
}
.prose td strong {
  color: var(--text);
}

/* ================== Images ================== */
.prose img {
  max-width: 100%;
  height: auto;
  display: block;
  margin: var(--s-5) auto;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: zoom-in;
  box-shadow: var(--shadow-md);
  transition: box-shadow 0.25s, transform 0.25s;
}
.prose img:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
}

/* ================== Mermaid ================== */
.mermaid-container {
  margin: var(--s-5) 0 var(--s-6);
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  overflow: hidden;
  position: relative;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s;
}
.mermaid-container:hover {
  box-shadow: var(--shadow-md);
}
.mermaid-container::before {
  content: 'Diagram';
  position: absolute;
  top: var(--s-3);
  left: var(--s-4);
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--text-subtle);
  z-index: 1;
  pointer-events: none;
}
.mermaid-container::after {
  content: 'click to zoom ↗';
  position: absolute;
  top: var(--s-3);
  right: var(--s-4);
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--text-subtle);
  opacity: 0;
  transition: opacity 0.15s;
  pointer-events: none;
}
.mermaid-container:hover::after {
  opacity: 1;
}
.mermaid {
  padding: var(--s-7) var(--s-5) var(--s-5);
  text-align: center;
  overflow-x: auto;
  cursor: zoom-in;
  font-family: var(--font-ui);
  min-height: 60px;
}
.mermaid svg {
  max-width: 100%;
  height: auto;
}

/* ================== Lightbox ================== */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(20, 17, 13, 0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--s-5);
  cursor: zoom-out;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: fadein 0.18s ease;
}
.lightbox[hidden] { display: none; }
@keyframes fadein {
  from { opacity: 0; }
  to { opacity: 1; }
}
.lightbox-content {
  width: 96vw;
  height: 92vh;
  overflow: hidden;
  background: var(--surface);
  border-radius: 12px;
  padding: 0;
  cursor: default;
  position: relative;
  box-shadow: 0 20px 80px rgba(0, 0, 0, 0.6);
  overscroll-behavior: contain;
  touch-action: none; /* we handle gestures ourselves */
}
.lightbox-content.is-grab { cursor: grab; }
.lightbox-content.is-grabbing,
.lightbox-content.is-grabbing > .lightbox-stage,
.lightbox-content.is-grabbing > .lightbox-stage * { cursor: grabbing !important; }
.lightbox-content > .lightbox-stage {
  position: absolute;
  top: 0;
  left: 0;
  /* width / height set programmatically to SVG natural size */
  transform-origin: 0 0;
  /* transform: translate() scale() set programmatically */
  will-change: transform;
}
.lightbox-content > img {
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  margin: auto;
  max-width: calc(100% - 32px);
  max-height: calc(100% - 32px);
  height: auto;
  width: auto;
  display: block;
}
.lightbox-content .lightbox-stage svg {
  display: block;
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none; /* drag goes to stage / lightboxContent */
}
.lightbox-toolbar {
  position: absolute;
  top: var(--s-3);
  left: var(--s-3);
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 4px 8px;
  box-shadow: var(--shadow-sm);
  font-family: var(--font-ui);
  font-size: 12px;
  color: var(--text);
}
.lightbox-zoom-label {
  min-width: 44px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
  color: var(--text-subtle);
}
.lightbox-btn {
  width: 30px;
  height: 30px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 50%;
  font-size: 16px;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-ui);
  line-height: 1;
  transition: border-color 0.15s, background 0.15s, color 0.15s;
}
.lightbox-btn:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
}
.lightbox-close {
  position: absolute;
  top: var(--s-3);
  right: var(--s-3);
  width: 36px;
  height: 36px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 50%;
  font-size: 20px;
  font-weight: 400;
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-ui);
  line-height: 1;
  z-index: 2;
  transition: border-color 0.15s, background 0.15s;
}
.lightbox-close:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
}
@media (max-width: 720px) {
  .lightbox-toolbar { font-size: 11px; padding: 3px 6px; }
  .lightbox-btn { width: 28px; height: 28px; font-size: 14px; }
  .lightbox-zoom-label { min-width: 38px; }
}

/* ================== Footer ================== */
.footer {
  max-width: var(--content-max);
  margin: var(--s-9) auto 0;
  padding-top: var(--s-5);
  border-top: 1px solid var(--border);
  font-family: var(--font-ui);
  font-size: 12.5px;
  color: var(--text-subtle);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--s-3);
}
.footer span { letter-spacing: 0.02em; }

/* ================== Loading / Reveal ================== */
.loading {
  text-align: center;
  color: var(--text-subtle);
  font-family: var(--font-ui);
  font-size: 14px;
  padding: var(--s-9) 0;
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 0.9; }
}

.reveal {
  animation: reveal 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes reveal {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ================== Wide diagrams on big screens ================== */
@media (min-width: 1280px) {
  .prose .table-scroll,
  .prose .mermaid-container {
    max-width: 100%;
  }
}

/* ================== Print ================== */
@media print {
  .topbar, .sidebar, .sidebar-overlay, .progress, .lightbox { display: none !important; }
  body { display: block; background: white; color: black; font-size: 11pt; }
  body { background-image: none; }
  .content { padding: 0; max-width: 100%; }
  .prose { max-width: 100%; }
  .prose h2 { page-break-before: always; }
  .prose h2:first-of-type { page-break-before: auto; }
  .mermaid-container,
  .prose img,
  .prose table,
  .prose pre { page-break-inside: avoid; }
  .prose a { color: black; text-decoration: underline; }
  .mermaid-container::before, .mermaid-container::after { display: none; }
}

:target { scroll-margin-top: 24px; }

a:focus-visible,
button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}
</style>

# Amira — Platform Architecture

> operated. Choices that are not yet finalised are clearly labelled

> Scope: QDT's hosted Amira at `amira.qdt.ai` running in QDT's Azure
> subscription. The customer-environment redeployment model is
> described in §13 as a configuration of this same platform.

The control plane (`amira-platform`) holds all durable state and

#### Provisioning notes

- Both AKS clusters use **nested-virt-capable VM SKUs**
  (`Standard_D*s_v5` / `Standard_E*s_v5` family) for any node pool
  hosting Kata-Firecracker pods (per RUNTIME-3, DEPLOY-2). The
  `system` node pools can use cheaper SKUs.
- The **Compliance-Mode** Blob container lives in its own storage
  account so its locked retention policy is independent of the
  general-purpose Blob account (per AUDIT-1).
- **Postgres** is single-region with point-in-time restore in v1; an
  HA replica is operational tuning (per RUNTIME-1 follow-up).
- **Authoritative DNS** in the diagram shows Azure DNS as the working
  assumption (cleaner DNS-01 wildcard issuance than Namecheap's
  registrar-only DNS); the Namecheap-stays-authoritative alternative
  is operational, not architectural.

#### How to read this

- Every user request enters at L1, threads down through L2 → L3,
  consults L4 (catalog / policy / identity), persists durable state
  through L5 into L6, and (for build / deploy / runtime) drives L7.
- L8 is everything outside the platform's blast radius: model
  inference, package mirror, customer data, customer IdP.
- Tenant isolation lives at L4 + L6 (RLS keyed on `org_id`,
  immutable session attributes set at connection open per PERSIST-5)
  and at L7 (namespace-per-org-per-app + NetworkPolicy default-deny
  per DEPLOY-2).

#### Traffic terminations

- `amira.qdt.ai` (UI, API, SSE) terminates at the platform cluster's
  nginx ingress.
- `<appslug>-<orgslug>.apps.amira.qdt.ai` (preview + deployed apps,
  per BUILD-2) terminates at the workloads cluster's nginx ingress;
  one wildcard cert covers all (DNS-01).
- Custom domains for deployed apps terminate at the same ingress
  with per-domain certs (HTTP-01).
- `.well-known/openapi.json` for each deployed app is served by the
  same app pod (per API-GATEWAY-1).

#### Egress posture

- Public-registry hostnames (npmjs.org, pypi.org) are blocked at the
  cluster egress; all installs route through Artifactory.
- Each deployed app's NetworkPolicy allowlist is rendered from its
  spec's resolved skill set (per CROSS-4 layer 4) — only declared
  hostnames are reachable.

## 1. System overview

Amira is a multi-tenant SaaS platform that turns a natural-language
specification into a running enterprise application, governed at every
hand-off by an immutable audit trail. Users (organized into orgs and
business-unit workspaces) interact with three pipeline agents — Spec,
Build, and Deployment — to converge a spec, generate code, and ship a
preview or a production deployment. Every deployed app can optionally
be promoted to a **companion agent** that other users invoke via Ask
Amira, inheriting the source app's permissions and audit boundary.

The platform runs on two AKS clusters in QDT's Azure subscription.
`amira-platform` holds the control plane: the platform UI, the agent
runtimes (Spec / Build / Deploy / Companion drivers), the durable
workflow engine, the Postgres family that owns all tabular state +
vector embeddings + audit ledger, the skill catalog, the identity
layer, and the Grafana observability stack. `amira-workloads` runs
two classes of pods on Kata-Firecracker microVMs: short-lived sandbox
pods (build, preview, repo-import, skill dry-run) and long-lived
deployed-customer-app pods, both governed by the upstream Kubernetes
`agent-sandbox` CRD. The two clusters are connected via Azure VNet
peering; the platform's DBOS workflow drives the workloads cluster's
Argo Rollouts controller through its Kubernetes API. nginx ingress
terminates `amira.qdt.ai` on the platform cluster and
`*.apps.amira.qdt.ai` on the workloads cluster, with TLS via
cert-manager + Let's Encrypt.

State sits in three substrates: PostgreSQL (Azure Database for
PostgreSQL Flexible Server, with pgvector) is the system of record
for all relational state, vector embeddings, durable workflow
checkpoints, the per-service audit outboxes, and the hash-chained
audit ledger; Azure Blob Storage (S3-compatible interface) holds
spec exports, build artifacts, signatures, content-addressable build
inputs, and the WORM-mode immutable Merkle anchors that seal the
audit chain hourly; Azure Key Vault holds skill secrets and platform
credentials, surfaced to pods through the external-secrets-operator
sidecar pattern.

Identity propagates user-to-downstream via OAuth 2.0 OBO (RFC 8693
Token Exchange) with a cumulative `act` claim; every agent has its
own service identity and obtains downstream tokens by exchanging the
calling user's token, never by impersonating with a service-account
credential. Skills are MCP servers with an Amira manifest overlay
(role-gating, source-tier, secret refs, `sideEffect`-per-tool); the
Build Agent resolves them at compile time into a `build-plan.lock`
that is the audit-evidence handle for every build. Sandboxes are
hardware-isolated by Kata-Firecracker; deployed apps run on the same
microVM class with NetworkPolicy default-deny + spec-derived egress
allowlists.

## 2. Component inventory

### 2.1 User-facing surfaces

#### Platform UI (`amira.qdt.ai`)

- **Responsibility** — Renders the Home portal, Specifications
  workspace, Canvas, Skills marketplace, Projects/Artifacts views,
  Settings, Ask Amira (full page + drawer), Project Governance,
  Approval surface, Audit Log. Ships as a Next.js (App Router)
  application that calls the Platform API for state.
- **Technology** — Next.js + TypeScript + Tailwind. (default; matches
  the same stack the platform generates for customer apps, per
  BUILD-1.)
- **Data ownership** — None. Pure consumer of Platform API + SSE
  streams.
- **Dependencies** — Platform API, Platform IdP (OIDC redirect
  flow), Streaming endpoint (SSE).

#### Streaming endpoint (Server-Sent Events)

- **Responsibility** — One SSE connection per active Build/Spec
  session. Streams structured narration events (`instruction-received`,
  `binding-resolved`, `file-written`, `compliance-re-evaluated`,
  `hot-reload-applied`) from the agent runtime to the user's browser.
- **Technology** — SSE over HTTP, terminated at nginx ingress on
  `amira-platform` (per STREAM-1).
- **Data ownership** — None; it tails events from the agent runtime's
  in-process queue and from Postgres (LISTEN/NOTIFY on outbox tables
  for durable resumption).
- **Dependencies** — Agent runtimes; Postgres LISTEN/NOTIFY for
  resume-after-disconnect.

### 2.2 Control-plane services (in `amira-platform`)

#### Platform API

- **Responsibility** — REST + SSE surface for the UI; entry point
  for all user requests. Authenticates the request via session
  cookie, resolves `(orgId, userId, role)`, sets immutable session
  attributes on Postgres connections, dispatches to the agent
  runtime, the skill catalog, or direct Postgres reads.
- **Technology** — FastAPI (default; revisit if constraints change —
  the platform team is fluent in FastAPI; the Claude Agent SDK has
  first-class Python support; DBOS's natural shape is Python-decorated
  functions).
- **Data ownership** — None directly; orchestrates calls into agent
  runtimes and Postgres.
- **Dependencies** — Platform IdP, Postgres, Agent Runtimes, Skill
  Catalog, OPA, Grafana (OpenTelemetry export).

#### Agent runtimes (Spec / Build / Deploy / Companion drivers)

- **Responsibility** — Run the Claude Agent SDK's tool-use loop
  inside a DBOS-checkpointed workflow for each agent session. The
  Spec runtime drives spec elicitation, the Build runtime drives
  code edits via the file-ops API into the session's sandbox pod,
  the Deploy runtime drives the helm-render → image-build → Argo
  Rollouts → smoke-test pipeline, and Companion runtimes serve
  Ask-Amira invocations of deployed apps' synthesized MCP servers.
- **Technology** — Claude Agent SDK (per RUNTIME-1, RUNTIME-2,
  RUNTIME-6) on top of DBOS workflows checkpointing into Postgres
  (per RUNTIME-1). Process model: long-lived Python worker pods
  pulling work from DBOS queues.
- **Data ownership** — Owns each session's transient working state;
  durable state lives in DBOS workflow tables in Postgres.
- **Dependencies** — Postgres (DBOS state), LLM provider via the
  adapter (default Anthropic API; env-toggle to Bedrock / Vertex /
  Foundry per LLM-6), Skill Catalog, MCP servers (skill backends),
  `agent-sandbox` CRD in workloads cluster, OPA, Azure Key Vault
  via external-secrets-operator, Audit Outbox tables.

#### DBOS workflow engine

- **Responsibility** — Durable execution of every Spec / Build /
  Deploy / Companion-register session and every continuous-compliance
  probe (per RUNTIME-1, ORCH-2, COMPLY-1). Step-checkpoints model
  calls, file-ops, MCP tool calls into Postgres so a worker crash
  resumes the session at the last checkpoint with replay-correctness.
- **Technology** — DBOS Python (per RUNTIME-1) — Postgres-resident
  workflow engine; library, not a separate cluster.
- **Data ownership** — DBOS-managed Postgres tables for workflow
  state (event history, queues, schedule).
- **Dependencies** — Postgres only.

#### Skill Catalog + MCP Registry

- **Responsibility** — Stores every skill's MCP manifest + Amira
  overlay (role-gating, source-tier, secret refs, `sideEffect`-
  per-tool, signing key id, lifecycle state); resolves the per-build
  catalog into the `build-plan.lock`; gates community-tier promotions
  through the curation pipeline (per SKILL-1, SKILL-3, SKILL-5,
  SKILL-2). Also hosts companion-agent MCP-manifest entries (tier:
  `deployment-proprietary`).
- **Technology** — In-process service inside Platform API (default;
  revisit if it needs to scale independently). Manifests live in
  Postgres; signed bundles and SBOMs in Azure Blob Storage.
- **Data ownership** — `skill`, `skill_version`, `skill_role_grant`,
  `skill_secret_binding`, `companion_agent_version`, plus `build_plan`
  and `build_plan_skill_binding` rows.
- **Dependencies** — Postgres, Azure Blob Storage, the
  curation-pipeline scanners (Socket + Snyk + custom prompt-injection
  scanner + Kata-Firecracker dry-run), Azure Key Vault for skill
  signing keys per tier (per SKILL-3).

#### Platform IdP (and identity layer)

- **Responsibility** — Authenticates platform users; federates from
  customer org IdPs (OIDC / SAML / OAuth 2.0); issues tokens that the
  agent runtime exchanges for downstream OBO tokens; is the OAuth 2.0
  authorization server for the RFC 8693 token-exchange endpoint.
- **Technology** — Hosted IdP that speaks OIDC / SAML / OAuth 2.0
  with Token Exchange (RFC 8693). Concrete pick: open follow-up listed
  under the LLM-6 / IdP cluster (default working assumption: a
  managed IdP that supports federation + custom OIDC client
  registration + Token Exchange — Auth0 and WorkOS are the two
  realistic candidates given Token-Vault / OBO support; final pick
  is operations posture, not architecture).
- **Data ownership** — User identity records; federation
  configurations per org; token-exchange grants. Mirrored into
  Postgres for the platform's `user`, `org_membership`, and
  `org_idp_federation` tables.
- **Dependencies** — Postgres (cached identity), customer IdPs at
  federation time.

#### OPA policy engine

- **Responsibility** — Evaluates retrieval-plane authorization
  (chunks before LLM context, per PERSIST-5), deploy-gate threshold
  policies on CVE / dependency-policy / compliance-score outputs
  (per DEPLOY-4), and write-action gating against the spec capability
  graph (per AGENT-GUARD-1). Single OPA stack across both surfaces
  per PERSIST-5 follow-up.
- **Technology** — Self-hosted OPA, Rego policies (per PERSIST-5
  follow-up).
- **Data ownership** — Policy bundles versioned per platform release;
  hot-reloaded.
- **Dependencies** — Postgres for policy-input data lookups
  (workspace memberships, role grants); none external.

#### Audit Consumer

- **Responsibility** — Polls every service's outbox table with
  `SELECT FOR UPDATE SKIP LOCKED` (per ORCH-1), validates payloads
  against the per-kind validator registry, computes the next
  hash-chain row, and inserts into the audit ledger with the
  `(orgId, projectSeq)` carried through from the outbox row.
- **Technology** — Single-process Python service. v1 ships one
  consumer (per ORCH-1); migration to per-partition consumers is
  flagged with a sustained-throughput trigger.
- **Data ownership** — `audit_ledger` table; per-project audit
  sequence (`audit_seq_<projectId>` Postgres sequences).
- **Dependencies** — Postgres only.

#### WORM Anchor Job

- **Responsibility** — Hourly job that reads the audit chain tip,
  computes the Merkle root, writes it to Azure Blob Immutable
  Compliance Mode in QDT's subscription, and records the anchor
  digest as the next ledger row's hash input (per AUDIT-1).
- **Technology** — DBOS-scheduled workflow (default; revisit if
  constraints change).
- **Data ownership** — Anchor blobs (Compliance-Mode locked, 7-year
  retention) and `audit_anchor` table rows.
- **Dependencies** — Postgres, Azure Blob Storage.

#### Grafana / Loki / Tempo / Mimir stack

- **Responsibility** — Self-hosted observability for both clusters.
  Loki ingests platform + workloads logs; Tempo holds OpenTelemetry
  traces (including the redacted LLM-context trace store per OBS-3 +
  CROSS-6); Mimir holds metrics. Per-route SLIs computed from spans
  per OBS-2.
- **Technology** — Grafana stack self-hosted in `amira-platform`
  (per OBS-3). Azure Monitor / Application Insights / Log Analytics
  rejected on cloud-portability grounds.
- **Data ownership** — Trace and log retention policies (audit-bound
  views over LLM-context-redacted spans; retention separate from the
  7-year audit-ledger window).
- **Dependencies** — OpenTelemetry collector running as a DaemonSet
  in both clusters.

#### Reviewer Agent (linter)

- **Responsibility** — Runs the spec-side linter that scans free-text
  spec sections for vendor SDK imports, hostnames, and known
  function names (per CROSS-4 layer 2), surfacing structured
  warnings in the Spec UI (per CROSS-4 follow-up). Also evaluates
  the spec convergence rubric (per SPEC-1).
- **Technology** — Library inside the Spec Agent runtime; not a
  separate service.
- **Data ownership** — Linter pattern library (versioned with platform
  releases).
- **Dependencies** — Spec Agent runtime, Spec capability graph
  (per SPEC-DECOMP-1).

### 2.3 Storage

#### PostgreSQL (Azure Database for PostgreSQL Flexible Server, pgvector)

- **Responsibility** — System of record for all relational state +
  vector embeddings + DBOS workflow state + per-service audit
  outboxes + the audit ledger itself (per PERSIST-1, PERSIST-1
  follow-ups, AUDIT-1).
- **Technology** — Azure Database for PostgreSQL Flexible Server
  (per PERSIST-1 follow-ups). Self-hosted in-cluster Postgres
  operator rejected.
- **Data ownership** — All platform tabular state (see §4).
- **Dependencies** — None upstream; consumed by every control-plane
  service. Connection-pooling via PgBouncer / Supavisor sidecars
  open per RUNTIME-1 follow-up.

#### Azure Blob Storage

- **Responsibility** — S3-compatible object storage for spec exports,
  build artifacts, signatures, content-addressable build inputs (CAS
  keyed by `(spec_hash, skill_versions, build_inputs)` per BUILD-4),
  build-plan.lock blobs (per SKILL-2), and the WORM-mode immutable
  Merkle anchors (per AUDIT-1).
- **Technology** — Azure Blob Storage in QDT's subscription, accessed
  through an S3-compatible interface (per BUILD-4 follow-ups,
  PERSIST-1 follow-ups). MinIO self-hosted rejected. The Compliance
  Mode container is a separate locked-policy container in the same
  subscription.
- **Data ownership** — Spec / build / artifact / audit-anchor blobs.
- **Dependencies** — Postgres holds pointers (content hashes) into
  Blob.

#### Azure Key Vault

- **Responsibility** — Holds skill secrets (three modes per SKILL-4:
  `shared-platform`, `per-deployment`, `per-user-OAuth`), platform
  service credentials, signing keys per skill tier (per SKILL-3),
  TLS material managed by cert-manager. Entra-ID-integrated for
  OBO-flow secret access (per SKILL-4 follow-up).
- **Technology** — Azure Key Vault (per SKILL-4 follow-up). HashiCorp
  Vault rejected.
- **Data ownership** — All non-data secret material.
- **Dependencies** — Surfaced into pods via `external-secrets-operator`
  (default; revisit if constraints change). Pods never read Key Vault
  directly.

#### Azure Container Registry (ACR)

- **Responsibility** — Stores images Buildkit pushes for deployed
  customer apps and platform images.
- **Technology** — ACR in QDT's subscription (per 00-context.md and
  DEPLOY-3).
- **Data ownership** — Image manifests + layers.
- **Dependencies** — Buildkit (push); Argo Rollouts / Helm (pull).

#### JFrog Artifactory (npm + PyPI + container mirror)

- **Responsibility** — Sole install source for every `npm install`
  and `pip install` issued by build sandboxes, preview pods, and
  deployed-app pods. Sigstore-compatible. Three-layer policy:
  mirror, plus behavioural / CVE / provenance scan, plus a
  per-deployment allowlist (per BUILD-6, BUILD-6 follow-ups).
- **Technology** — JFrog Artifactory (per BUILD-6 follow-ups). Public
  registries refused at the cluster egress boundary.
- **Data ownership** — Mirrored package versions + provenance
  metadata (Sigstore attestations).
- **Dependencies** — Socket (behavioural scan), Trivy (CVE scan),
  and Sigstore cosign (provenance verification) called on every
  install (per BUILD-6 follow-ups).

### 2.4 Workload-cluster components (in `amira-workloads`)

#### `agent-sandbox` CRD + `SandboxWarmPool`

- **Responsibility** — Provisions short-lived, hardware-isolated
  sandbox pods for Build sessions, Preview sessions, Repo-import
  pipelines, and Skill curation dry-runs. Warm pools keep
  cold-start under one second (per RUNTIME-3, BUILD-2).
- **Technology** — Upstream Kubernetes `agent-sandbox` CRD (SIG-Apps
  ratified, March 2026). Kata-Firecracker `RuntimeClass` for every
  sandbox pod. AKS Pod Sandboxing enabled at cluster provisioning.
- **Data ownership** — Pod-local ephemeral storage only; no durable
  state.
- **Dependencies** — Kubernetes API, Artifactory mirror, Azure Key
  Vault (via external-secrets-operator), Platform API (file-ops API
  endpoint), GitHub (per-app repo two-way sync), HMR-aware framework
  containers (Next.js + FastAPI default per BUILD-1, BUILD-3).

#### Argo Rollouts controller

- **Responsibility** — Reconciles every `Rollout` CR for deployed
  customer apps. BlueGreen with `prePromotionAnalysis` runs the
  AC-runner + k6 NFR probes; abort-on-failure attributes back to
  the failing AC in audit (per DEPLOY-3, DEPLOY-5, DEPLOY-6).
- **Technology** — Argo Rollouts (per DEPLOY-3, 00-context.md). Argo
  CD intentionally not adopted in v1 (per DEPLOY-3 — DBOS workflow
  and audit ledger are the single source of truth for deployment
  state).
- **Data ownership** — `Rollout` CR state; `AnalysisRun` history
  (Kubernetes API state).
- **Dependencies** — `amira-workloads` Kubernetes API, ACR (image
  pull), platform DBOS (drives the chart push and reads run state).

#### Buildkit pod

- **Responsibility** — Builds container images for deployed apps.
  Pulls dependencies through Artifactory; pushes images to ACR.
- **Technology** — Open-source Buildkit on AKS (per DEPLOY-3). ACR
  Tasks rejected on cloud-portability grounds; off-cluster Buildkit-
  as-a-Service rejected (no need for an external dep on the deploy
  hot path).
- **Data ownership** — Layer cache (ephemeral / configurable on a
  Persistent Volume).
- **Dependencies** — Artifactory, ACR.

#### Companion-agent MCP servers

- **Responsibility** — Each deployed app that opted in to companion-
  agent provisioning at deploy time runs an MCP server alongside its
  app pod. The server exposes the deploy-time-resolved Build Plan
  tools, branded by the app's spec FRs (tool descriptions) and ACs
  (smoke tests). Calls land here from the platform Companion runtime
  on behalf of an Ask-Amira user; downstream queries run under the
  caller's OBO token (per AGENT-1, AGENT-2).
- **Technology** — Synthesized SKILL.md + MCP server, generated at
  deploy step from the Build Plan (per AGENT-1 follow-ups). One
  companion-agent version per build (locked one-to-one).
- **Data ownership** — None; downstream calls hit customer data
  sources or skill-backed MCP servers.
- **Dependencies** — Skill Catalog (manifest entry), Azure Key Vault
  (skill secrets), Platform IdP (OBO exchange), customer data
  sources, Audit Outbox tables.

#### Deployed customer apps

- **Responsibility** — Run customer applications (Next.js + FastAPI
  by default) provisioned per `org-<orgId>-app-<appId>-<env>`
  namespace.
- **Technology** — Per-stack Helm chart (initial:
  `amira-app-nextjs-fastapi`); Kata-Firecracker pods; per-namespace
  NetworkPolicy default-deny + spec-derived egress allowlist (per
  CROSS-4 layer 4).
- **Data ownership** — Customer-app-owned tables in per-app database
  (provisioning model is open; per PERSIST-1 follow-up).
- **Dependencies** — Skills (MCP servers, customer warehouses),
  Artifactory, ACR, Azure Key Vault.

    Deploy->>SC: synthesize SKILL.md + MCP server
    SC->>Comp: deploy companion MCP pod (opt-in)
    SC->>Reg: write companion_agent_version row<br/>(tier=deployment-proprietary, paired with build)
    Deploy->>Out: audit (kind=deploy-promoted, kind=companion-registered)
  else Fail
    Argo->>App: abort, keep previous active
    Deploy->>Out: audit (kind=deploy-aborted, failingAcId)
  end
```

## 4. Persistence layer

The platform operates one Postgres family, one S3-compatible object
store, and one secret store. Three operational substrates total — by
design, to keep the operations surface minimal (per RUNTIME-1,
PERSIST-1).

### 4.1 PostgreSQL (Azure Database for PostgreSQL Flexible Server)

Holds tabular state, vector embeddings, durable workflow state, audit
outboxes, and the audit ledger itself. Single instance for v1; logical
separation by table; PgBouncer / Supavisor sized for the workflow +
application + audit triple-workload (specifics open per RUNTIME-1
follow-up).

| Table family | What it holds | Retention | Consistency |
| --- | --- | --- | --- |
| `org`, `org_membership`, `user`, `org_idp_federation`, `role`, `role_grant` | Identity + tenancy graph | Lifetime of org + 90 days post-deletion (default) | Strong; RLS keyed by `org_id` |
| `workspace` (BU), `workspace_membership` | Sub-tenant grouping inside an org | Same as org | Strong; RLS keyed by `org_id` (BU enforced via `workspace_id` predicate) |
| `project`, `project_governance`, `project_collaborator` | Project records, governance role assignments, exposure scope | Lifetime of project + archival window | Strong; RLS |
| `spec_version`, `spec_capability_graph`, `decision_point`, `gap`, `kb_attachment`, `spec_skill_reference` | Living spec doc, structured capability graph (per SPEC-DECOMP-1), knowledge base | Lifetime of project; immutable per version | Strong |
| `approval_request`, `approval_signature` | Approval routing + e-signature records | 7 years (audit-bound) | Append-only |
| `build`, `build_plan`, `build_plan_skill_binding`, `build_artifact_pointer` | Per-build state; pointers into Blob CAS | Lifetime of project | Append-only per build |
| `compliance_matrix_row`, `compliance_evidence`, `compliance_score_history` | Per-FR compliance evidence + scores | Lifetime of project | Mutable (continuous re-eval per COMPLY-1) with history |
| `deploy_run`, `deploy_smoke_result`, `deploy_companion_pin` | Deploy lifecycle + AC-tagged smoke results + paired companion-agent version pin (per DEPLOY-5) | Lifetime of project | Append-only |
| `skill`, `skill_version`, `skill_role_grant`, `skill_secret_binding`, `skill_signature`, `skill_lifecycle` | Skill catalog + tier-signed manifests | Lifetime of skill (immutable per version per SKILL-5) | Append-only per version |
| `companion_agent_version`, `companion_agent_active_pointer` | Companion-agent registry; active-pointer per source app | Lifetime of source app | Append-only versions; pointer flip is the rollback primitive |
| `kb_doc`, `kb_chunk` (with `pgvector`), `kb_promotion` | Knowledge-base attachments; embeddings; per-KB-promotion scope (private / team / org per KB-PROMOTION-1) | Lifetime of project | Mutable |
| DBOS workflow tables (managed) | Workflow event histories, queues, schedules | Per workflow lifetime + tunable retention | Strong (DBOS guarantees) |
| Per-service `_outbox` tables | Audit events pending consumption (per ORCH-1) | Until consumed (TTL on consumed rows) | Append-only |
| `audit_ledger` (monthly partitions) | Hash-chained ledger; one row per audit event with `(orgId, projectSeq)` index | 7 years (regulatory) | Append-only with hash-chain integrity |
| `audit_anchor` | Hourly Merkle anchor records (digest, blob URI) | 7 years | Append-only |
| `llm_call`, `llm_call_metering` | OpenTelemetry-derived per-call metering rows (per LLM-4); aggregated views over | 13 months (default; revisit if billing posture changes) | Append-only |
| `audit_kind_validator` | Per-kind presence-rule registry (per AUDIT-2) | Lifetime of platform | Strong |

**Tenancy isolation** — Postgres RLS enforces row visibility keyed
by `org_id`. Snowflake-style immutable session attributes (per
PERSIST-5) are set on every connection at session open; generated SQL
or tool calls inside the session cannot rewrite them. Workspace (BU)
isolation is a second predicate (`workspace_id`) inside the same RLS
mechanism.

**Backup story** — Azure Database for PostgreSQL Flexible Server
manages backups; geo-redundant backup with 35-day point-in-time
restore is the default working assumption (default; revisit if
constraints change). The audit-ledger immutability story does not
depend on Postgres backup — it is owned by the WORM anchor in
Azure Blob Compliance Mode (§4.3, §10).

### 4.2 Vector embeddings (pgvector inside the same Postgres)

Per PERSIST-1, pgvector is the only vector backend. Embeddings live
on the same Postgres instance — `kb_chunk.embedding`,
`spec_capability_graph.embedding` (where useful for retrieval),
companion-agent context indexes. Pinecone / Weaviate / LanceDB /
Chroma are out of scope.

### 4.3 Object storage (Azure Blob, S3-compatible interface)

| Container | What it holds | Retention | Consistency |
| --- | --- | --- | --- |
| `specs` | Spec exports (PRD / SOW / cost / risk PDFs per 2.5) | Lifetime of spec version | Read-after-write |
| `artifacts` | Built deployable bundles, source bundles, deploy reports | Lifetime of project + archival window | Read-after-write |
| `cas` | Content-addressable build inputs keyed by `(spec_hash, skill_versions, build_inputs)` (per BUILD-4) | Lifetime of project (cache-evictable on TTL where the row is no longer referenced from a live `build` row) | Read-after-write |
| `lockfiles` | `build-plan.lock` blobs (per SKILL-2) | Lifetime of project | Read-after-write |
| `signatures` | E-signature blob payloads (full signed envelope, audit-cross-referenced) | 7 years | Read-after-write |
| `audit-anchors` (Compliance Mode) | Hourly Merkle anchors (per AUDIT-1, PERSIST-2 + AUDIT-1) | 7 years, locked policy | WORM (immutable; cannot be modified by Microsoft, by QDT operators, or anyone) |
| `skill-bundles` | Signed MCP-server bundles + SBOM attestations per skill version | Lifetime of skill version (immutable per SKILL-5) | Read-after-write |

Code never binds to provider-specific SDKs; everything goes through
the S3-compatible interface (per PERSIST-1) so re-pointing to MinIO
or another provider is a configuration change.

### 4.4 Generated codebase storage

Two layers, both required (per BUILD-4, BUILD-4 follow-ups):

- **User-facing layer:** per-project Git repository at GitHub under
  a single QDT-managed Git org (per BUILD-4 follow-ups). One repo per
  app. Branch = spec version; tag = build number. The Build Agent's
  file-ops API writes to the sandbox pod and commits + pushes through
  a two-way sync.
- **Internal layer:** content-addressable storage in Blob (`cas`
  container) keyed by the build-input triple. Reproducibility is a
  contract, not best-effort: rebuilding `(spec_hash, skill_versions,
  build_inputs)` retrieves the same artifact bytes.

Time-travel UI in Canvas is Phase 2 (per BUILD-4 follow-ups).

### 4.5 Secrets

Azure Key Vault holds all secret material — skill secrets in three
modes (`shared-platform`, `per-deployment`, `per-user-OAuth` per
SKILL-4), platform service credentials, and tier-signing keys
(QDT release key, deployment-admin keys, community-publisher keys
per SKILL-3). Pods read secrets via the external-secrets-operator
sidecar pattern (per 00-context.md "Secrets" + SKILL-4); no pod
embeds secret values in image, code, or environment files at build
time. Secrets never reach LLM context (per LLM-5).

## 5. Identity, auth, and authorization

### 5.1 Sign-in and session

Platform users authenticate against the Platform IdP at
`amira.qdt.ai`. The IdP federates from each org's customer IdP
(OIDC / SAML / OAuth 2.0) at org-onboarding time; users sign in
through their company SSO and land in their org's workspace
(per IDA-2, MTEN-1). Just-in-time user provisioning creates the
`user` + `org_membership` rows on first login.

Sessions are issued as secure, HttpOnly cookies bound to the IdP-issued
ID token + refresh token. Step-up MFA is required for sensitive
actions: deploy, e-signature, secret-binding configuration (per IDA-5).
PATs are a strict subset of user capabilities — they cannot sign
approvals, read skill secrets, or trigger writes against external
systems (per IDA-5).

### 5.2 Authorization at request time

Every request reaches the Platform API with a session-resolved
identity (`orgId`, `userId`, `roles`). The Platform API:

1. Sets immutable session attributes on the Postgres connection
   (`SET LOCAL app.org_id = …`, `app.user_id = …`, plus a no-rewrite
   guard per PERSIST-5).
2. Enforces tenancy via Postgres RLS keyed on `org_id`, with a
   second `workspace_id` predicate for BU scope (per IDA-2).
3. Calls OPA at the retrieval plane for policy decisions on data
   chunks before they reach LLM context (per PERSIST-5 follow-up).

`access = (tenant_match) ∧ (role_grant)` — these are independent
dimensions (per IDA-2). Single composite enums are rejected.

### 5.3 Identity propagation to downstream systems (OBO)

Every platform agent (Spec, Build, Deploy, Companion) holds its own
service identity registered with the Platform IdP. Downstream calls
against user-permissioned data — customer warehouses, skill MCP
servers, the platform's own Postgres for user-context queries — go
through OAuth 2.0 OBO via RFC 8693 Token Exchange. The user's
session token is exchanged for a downstream token whose `sub` is
the user and whose `act` claim is the agent (cumulative for
multi-hop delegation, capped at six elements per AUDIT-2). Service-
account-with-tenant-cookie is permanently rejected (per IDA-3).

For long-running agent jobs that outlive the originating session,
the platform uses the IdP's refresh-token flow (per IDA-3 follow-up).
On refresh failure the workflow checkpoints and pauses; the user
gets a re-auth notification; on re-auth the workflow resumes from
the last checkpoint with a fresh OBO token. Capability-token-
fallback and background-service-identity are rejected.

### 5.4 Skill resolution via OBO

When the agent invokes a skill MCP server, the runtime obtains an
OBO token for the call. Inside the skill server:

- **`shared-platform`** secrets are resolved from Key Vault by the
  vault sidecar — one secret value for all callers (per SKILL-4).
- **`per-deployment`** secrets are resolved per org, keyed by the
  caller's `org_id` (deployment admins set the value at install
  time).
- **`per-user-OAuth`** secrets require the calling user to have
  completed the skill's OAuth flow; the user's stored skill-token
  is fetched via the vault sidecar. First-call UX: if the user
  hasn't authorized, the agent surfaces a "connect {skill}" step
  inline.

Audit attribution is the three-field actor model: `userId`,
`agentId`, `serviceId`, with `causedBy` UUID pointing to the upstream
audit row (per IDA-3, AUDIT-2). Companion-agent calls record the
source app's `agentId` and the calling user's `userId`, with the
`act` chain reflecting the end-to-end delegation (per AGENT-2).

### 5.5 Customer-environment IdP federation

When Amira is redeployed into a customer environment (§13), the
customer's IdP becomes the Platform IdP for that deployment. The
customer's directory drives users + roles directly; federation is
not needed because there is only one IdP. The agent service
identities and OBO flow are reconfigured against the customer IdP.
Any IdP that speaks OIDC / SAML / OAuth 2.0 + Token Exchange is
supported — Mars's Entra ID is the reference case, with Microsoft
Entra Agent ID as the standardized OBO-for-agents pattern (per
00-context.md "Identity and authorization").

## 6. Agent runtime

### 6.1 SDK and execution model

Every agent (Spec, Build, Deploy, Companion driver) runs the
**Claude Agent SDK** as the inner tool-use loop, embedded inside a
**DBOS workflow** that checkpoints into the platform Postgres (per
RUNTIME-1, AGENT-TOPO-1). Workflows are decorated Python functions;
model calls, tool calls, and MCP-server calls are step-checkpointed
so a worker crash resumes at the last successful step with replay-
correctness. Stateless request/response is rejected for sessions that
routinely span many minutes and many tool calls.

Day-one topology is single-agent ReAct loop with tools (per
AGENT-TOPO-1). A verifier sub-agent (compliance re-eval running async
alongside the main loop) is added when the Compliance Matrix re-eval
starves the main loop's context budget — measurable trigger,
data-driven introduction, not day-one. Replit-style
manager/editor/verifier triads are deferred until single-agent error
rate is unacceptable.

### 6.2 Per-instruction routing

A small classifier model runs upfront on every chat instruction,
parallelized with context assembly so latency is hidden. Output is
a discrete intent label (`edit` / `binding-or-schema` / `out-of-scope`)
that dispatches to the specialized sub-agent path (per RUNTIME-4).
Misclassifications surface as out-of-scope blocks or wrong-tool
retries; both are observable and audit-emitting.

### 6.3 Code-edit modality (Build Agent)

Model emits search-replace blocks (or unified diff with elision); a
deterministic apply function does `str.replace(search, replace)`
against the file's current contents in-process and fails fast on
no-match or ambiguous-match (per RUNTIME-2). On failure the model
gets a structured error and re-emits with the current file contents
in context. Apply-failure rate is an SLI; retries emit structured
audit events. The file-ops API is the single seam the apply backend
lives behind — future swap-out (e.g., to self-hosted Morph) is a
single-point change. Aider's published 26% → 59% improvement from
emit/apply separation is the on-record reason this shape is locked.

### 6.4 Context and compaction

Long Build Agent sessions use the Claude Agent SDK's default 5-stage
compaction pipeline (budget reduction → snip → microcompact → context
collapse → auto-compact) for v1 (per RUNTIME-6). Custom per-stage
budgets are introduced only if dogfood telemetry shows the SDK
defaults wedge for QDT's edit patterns. Naive truncation and
summary-then-resume are rejected.

### 6.5 Streaming and resumability

Server-Sent Events from `amira-platform` to the user's browser, one
connection per session (per STREAM-1). Narration events follow a
structured event schema: `instruction-received`, `binding-resolved`,
`file-written`, `compliance-re-evaluated`, `hot-reload-applied`. User
pause / resume / cancel use separate REST endpoints. WebSocket
multiplexer and event-sourced read model are rejected as v1
over-scope. The DBOS workflow + Postgres LISTEN/NOTIFY on outbox
tables enables disconnected-then-reconnected clients to resume
streaming.

### 6.6 Tool calling

Every tool the agent invokes is an MCP tool (per SKILL-1). The agent
runtime resolves tools at compile time through the Build Plan
lockfile (Build / Deploy paths) or at session start through the
calling org's catalog view (Spec / Companion paths). At runtime the
runtime layer:

1. Re-validates the calling identity's role intersects the bound
   role; mismatch fails closed (per SKILL-2).
2. Looks up the per-tool `sideEffect` annotation. `read` tools
   execute without confirmation; `write` and `external-write` tools
   prompt the inline-confirm UX (per AGENT-3, AGENT-3 follow-up).
3. Acquires an OBO token for the call (per AGENT-2 follow-up —
   always-runtime token-exchange per call; sealed capability tokens
   rejected).
4. Calls the MCP server.
5. Writes a per-call audit event to the runtime's outbox (kind tied
   to the tool's side effect).

### 6.7 MCP integration

MCP is the wire format for all skills (per SKILL-1). The Skill
Catalog stores manifests (MCP standard fields + Amira overlay:
`role-gating`, `source-tier`, `secret-refs`, `app-agent-provenance`,
`lifecycle-state`, `sideEffect`-per-tool, `signing-key-id`,
`manifest-schema-version`). Non-MCP sources (proprietary internal
APIs, Anthropic Skills, raw OpenAPI) wrap behind QDT-maintained MCP
adapters. Non-immutable-publish MCP servers are wrapped: QDT pins
a content-hash version per fetch and re-publishes under a stable
Amira-managed version (per SKILL-1 follow-ups).

The Build Agent code-gen stage reads the resolved MCP endpoint from
the lockfile, never from a runtime registry lookup. Drift between
build-time and runtime endpoints is detectable as a content-hash
mismatch on the lockfile.

### 6.8 Cost-and-concurrency posture

Per-org concurrency limits (one Build Agent session per user at a
time within an org; org-level concurrent-user limit configurable per
subscription tier) + dynamic model-tier selection inside the agent
runtime: Haiku-class for classification / compliance scans /
out-of-scope checks, top-class for code-edit + spec elicitation
(per COST-CONC-1). Per-org BYOK (per LLM-6) is the release valve
when an org wants to lift platform-imposed limits using its own
credentials.

LLM caching is hierarchical via Anthropic's `cache_control` blocks
(per LLM-CACHE-1): system prompt + tool catalog cached per session
(long TTL); spec doc cached per spec version (invalidated on lock);
file-tree snapshot cached per build (invalidated on lockfile change);
tool-call results cached per `(skill-id, version, args)` tuple. The
env-var-toggle adapter preserves identical `cache_control` semantics
when migrating to Bedrock / Vertex / Foundry.

### 6.9 Guardrails

Layered defense-in-depth (per AGENT-GUARD-1):

1. Per-tool `sideEffect` annotation (deterministic primary classifier;
   manifest-validator rejects unannotated tools at the catalog gate
   per AGENT-3 follow-up).
2. OPA gates write actions against the spec's capability graph
   (per SPEC-DECOMP-1).
3. Runtime egress NetworkPolicy allowlist blocks calls to undeclared
   hostnames (per CROSS-4 layer 4).
4. Inline LLM-judge confirmation for `external-write` actions.
5. Kata-Firecracker per-pod isolation bounds blast radius.

### 6.10 Out-of-scope detection

Layered (per ORCH-4): capability-membership check against the spec's
capability graph (deterministic) → LLM judge with a structured rubric
for ambiguous cases the graph can't resolve. All decisions emit audit
events distinguishing first-pass blocks from second-pass blocks. The
spec capability graph is populated by the Spec Agent at finalization
(per ORCH-4 follow-up).

## 7. Build & preview infrastructure

### 7.1 Sandbox primitive

Every Build, Spec, Preview, and Repo-import session runs as one pod
managed by the upstream Kubernetes `agent-sandbox` CRD on the
`amira-workloads` cluster, with `SandboxWarmPool` for sub-second
cold-starts (per RUNTIME-3, BUILD-2). The `RuntimeClass` is
**Kata-Firecracker**: hardware-isolated microVMs with KVM-backed
per-pod kernel + network namespace isolation. AKS Pod Sandboxing is
enabled at cluster provisioning; node pools come from nested-virt-
capable VM SKUs (`Standard_D*s_v5` / `Standard_E*s_v5` family).
External Sandboxes-as-a-Service (Vercel Sandbox, E2B, Modal,
StackBlitz WebContainers) and container-only kernel-shared isolation
are both rejected (per RUNTIME-3).

### 7.2 Warm pools and stack templates

Each warm pool prebuilds a sandbox image per supported stack. v1
ships one pool: Next.js (App Router) + FastAPI (per BUILD-1).
Adding a stack costs one Helm chart + warm-pool template +
file-ops adapter + dependency-policy bundle + AC-runner adapter
(estimated ~1 dev-month at v1 maturity per BUILD-1). Pool sizing
is operational tuning (per RUNTIME-3 follow-ups, BUILD-2 follow-ups).

### 7.3 File-ops API and HMR

The Build Agent never touches the sandbox filesystem directly; all
mutations go through the file-ops API endpoint exposed by each
sandbox pod. The API performs atomic write-then-fsync-then-rename
operations (per BUILD-3); the framework's file watcher picks up the
rename and triggers HMR — Turbopack for Next.js, `uvicorn-hmr` for
FastAPI. When a change can't be HMR'd in place (large refactor,
dependency install, schema change), the dev server restarts and the
UI surfaces a `rebuilding (full restart)` state distinct from in-place
HMR.

The platform does not own the bundler. The framework's dev server
rebuilds and notifies; the file-ops API is the agent's only contract.

### 7.4 Preview hostnames

Hostname pattern: `<appslug>-<orgslug>.apps.amira.qdt.ai`
(per BUILD-2). One wildcard cert covers the namespace; nginx
ingress in `amira-workloads` terminates the connection and routes
to the sandbox pod's preview Service.

Warm-pool readiness is surfaced to the UI as a "preview ready"
state when the slot is allocated and the dev server reports ready;
the user does not see an opaque spinner (per BUILD-2).

### 7.5 Terminal / console

The Console / build log UI subscribes to a structured-event stream
emitted by the Build Agent (instruction received, binding resolved,
file written, compliance re-evaluated, hot-reload latency, apply
errors). Events are streamed over SSE (per STREAM-1) and persisted
to Loki for retrospective view; audit-relevant events also flow
to the audit ledger via the agent's outbox.

### 7.6 Lifecycle and cleanup

Sandbox pods are claimed from the warm pool on session start,
returned to the pool on session end (or torn down if customized
beyond reset), and time out after a configurable inactivity window
(default; revisit if constraints change). The CRD owns the lifecycle.
Build-session checkpoints and Git two-way sync preserve user work
across pod recycles.

### 7.7 Repo-import pipeline (reverse engineering)

Repo imports run inside the same `agent-sandbox` CRD pod class
(Kata-Firecracker per RUNTIME-3, REVENG-1). The pipeline does
AST-walk + framework-detection heuristics + LLM inference of
FRs/NFRs/ACs with provenance back to source files. Sandboxed-
execution probes (running the imported app) are rejected — slow
plus side-effect risk. CodeQL / Semgrep are over-scope for v1.
Imported non-Next/FastAPI stacks are host-only per BUILD-1 — the
platform can run them and serve them under the same hostname
pattern, but the Build Agent's full editing capability (HMR-driven
iteration, AC-driven smoke tests, compliance probes) is degraded
until that stack is added to v1's supported set.

## 8. Deployment infrastructure

### 8.1 Deploy orchestration engine

DBOS for the platform-side workflow + **Helm + Argo Rollouts** for
the K8s deploy step itself (per DEPLOY-3). Argo CD is intentionally
not adopted in v1 — the DBOS workflow + audit ledger is the single
source of truth for what got deployed; adding GitOps reconciliation
would create a second source of truth.

### 8.2 Per-stack Helm charts

QDT owns one Helm chart per supported stack. v1 ships
`amira-app-nextjs-fastapi` (per BUILD-1). Each chart templates the
customer app's `Rollout` CR, `Service`, `Ingress`, `NetworkPolicy`
(default-deny + spec-derived egress allowlist per CROSS-4), and
`ResourceQuota`. Charts are versioned and live alongside the platform
code; chart upgrades flow through the platform release process.

Per-app deploys are Helm releases in `org-<orgId>-app-<appId>-<env>`
namespaces. Helm release history backs the v1.0 forward-only rollback
posture (`helm rollback <release> <revision>`).

### 8.3 Image build

Buildkit pod inside `amira-workloads`. Pulls dependencies through
JFrog Artifactory (the only sanctioned source per BUILD-6). Pushes
to ACR. Each install is scanned by Socket (behavioural malware),
Trivy (CVE), and Sigstore cosign (provenance verification) per
BUILD-6 follow-ups. ACR Tasks rejected (cloud-portability);
off-cluster Buildkit-as-a-Service rejected (no need for an external
dep on the deploy hot path).

### 8.4 Argo Rollouts BlueGreen with AC-tagged smoke tests

Argo Rollouts BlueGreen brings up the new ReplicaSet, runs
`prePromotionAnalysis`, and either flips the Service selector
(success) or aborts and keeps the previous active (failure). The
`prePromotionAnalysis` AnalysisTemplate runs:

- The **AC-runner** — a custom Python runner (per DEPLOY-3) that
  consumes the spec's AC DSL (per SPEC-DECOMP-1) and executes each
  AC as a smoke test against the new ReplicaSet. As an example, a
  FinIQ spec's `period-end recon ±$0.5M` AC becomes a deploy-gate
  smoke test of the same shape (per DEPLOY-6).
- **k6** for spec-NFR latency probes (per DEPLOY-6, OBS-2).
- **OPA Rego deploy-gate policies** (per DEPLOY-4) consuming
  scanner outputs (Trivy CVE scan, dependency-policy bundle results
  from BUILD-6) and the latest compliance-score from the Compliance
  Matrix. Failures block traffic flip and emit AC-tagged audit
  events with the failing rule.

When an AC changes, the smoke test is regenerated from the new AC
by default and an audit event `ac-changed-test-regenerated` is
emitted (per DEPLOY-6 follow-up). Manual override is available via
PR with audit trail.

### 8.5 Domain provisioning

- **Default app domains:** wildcard `*.apps.amira.qdt.ai`. One
  wildcard cert in `amira-workloads`'s nginx ingress, issued by
  cert-manager + Let's Encrypt via DNS-01 (per 00-context.md).
  external-dns watches Ingress objects and creates the corresponding
  DNS records.
- **Custom domains for deployed apps:** opt-in per app. Per-domain
  Ingress, per-domain cert via HTTP-01.
- **Hostname pattern (per BUILD-2):** `<appslug>-<orgslug>.apps.amira.qdt.ai`
  — sub-domain per app scoped to org.

### 8.6 TLS

cert-manager with ClusterIssuer; Let's Encrypt as the default
issuer (production), with a staging issuer available for non-prod
(per 00-context.md). Wildcard cert via DNS-01; per-app custom
domain certs via HTTP-01.

### 8.7 Companion agent registration

After the Service-selector flip succeeds, the deploy DBOS workflow
synthesizes the SKILL.md + MCP server from the resolved Build Plan
tools, the spec's FRs (as natural-language tool descriptions), and
the spec's ACs (as smoke tests), and publishes a
`companion_agent_version` row in the Skill Catalog at tier
`deployment-proprietary` (per AGENT-1, SKILL-3, AGENT-1 follow-ups).
The companion-agent version is locked one-to-one with the build
version. The `companion_agent_active_pointer` for the source app
flips atomically with the deployed-app traffic switch.

Companion-agent provisioning is opt-in at deploy (per AGENT-1). The
deploy modal carries a "register companion agent" toggle with a
sensible default per project type. Synthesis happens at the deploy
step (manifest reflects deploy-environment bindings, not build-time
bindings, per AGENT-1 follow-ups). Authoring affordance is pure auto
for v1; explicit prompt customization is Phase 2.

### 8.8 Rollback model

v1.0 ships forward-only via `helm rollback <release> <revision>` —
the rollback UI surface in Canvas / Projects is "redeploy previous
build," not "atomic rollback" (per DEPLOY-5). v1.5 adds Argo
Rollouts BlueGreen rollback with the paired companion-agent
version-pin flip atomicity: the Skill Catalog stores both old and
new agent versions, and rollback flips the active pointer atomically
with the app's Service selector flip. Canary-with-progressive-traffic
is rejected for v1.x (BlueGreen suits AC-driven smoke tests better).

### 8.9 External API exposure (per app)

Thin sidecar (v1) per API-GATEWAY-1. Per-app API tokens issued
through Project Governance; spec-derived OpenAPI manifest at
`https://<appslug>-<orgslug>.apps.amira.qdt.ai/.well-known/openapi.json`;
every external call lands in the audit ledger tagged `external-api`;
audience-RBAC reuses the spec's role surface. No quotas UI, no
developer portal, no mTLS, no monetization in v1. Full API management
(Kong / Apigee parity) is Phase 2.

## 9. Event/orchestration architecture

### 9.1 Eventing backbone

Postgres outbox + idempotency-keyed consumer (per ORCH-1):

- Each platform service (agent runtimes, Skill Catalog, Approval
  service, Deploy workflow, etc.) owns an `<service>_outbox` table
  next to its business tables. Business writes and outbox writes
  commit in the **same Postgres transaction** (atomicity).
- One global Audit Consumer in v1 polls every outbox via
  `SELECT FOR UPDATE SKIP LOCKED`. Consumer outage delays audit
  visibility but never blocks business writes.
- Per-project monotonic sequence numbers are allocated from a
  Postgres sequence per project (`audit_seq_<projectId>`) at
  outbox-row insert. Audit ledger rows carry `(orgId, project_seq)`
  as a unique index for fast intra-project forensic queries.
- Cross-table commit-order is **not** preserved at the relay;
  cross-event ordering uses the `causedBy` causation DAG (per
  AUDIT-2), not WAL order.

WAL-tailing, multi-domain consumers, and UUID-only-no-sequence are
rejected for v1 with explicit migration triggers documented (per
ORCH-1: WAL-tail when sustained chain-write throughput exceeds ~1k
events/sec for a rolling 24h window; per-project chain sharding
when sustained throughput approaches the ~5k events/sec single-
writer ceiling). Cross-region fanout (Kafka / NATS JetStream) is
deferred until cross-region demand is real.

### 9.2 Three-agent pipeline orchestration (Spec → Build → Deploy → Companion)

Per-phase DBOS workflows with handoff via durable signal (per ORCH-2).
Each phase is its own DBOS workflow; the handoff envelope binds the
phases together durably.

```mermaid
flowchart LR
  Spec["Spec Workflow<br/>(DBOS)"] -->|"envelope:<br/>(specHash, approvalId)"| Build["Build Workflow<br/>(DBOS)"]
  Build -->|"envelope:<br/>(specHash, approvalId, lockHash, buildN)"| Deploy["Deploy Workflow<br/>(DBOS)"]
  Deploy -->|"envelope:<br/>(buildN, env, deployId)"| CompReg["Companion-Register Workflow<br/>(DBOS, opt-in)"]
  CompComply["Continuous Compliance<br/>(DBOS scheduled)"] -. "observes" .-> Build
  CompComply -. "observes" .-> Deploy
  Spec --o Out1["audit: spec-edit /<br/>spec-locked / approval-signed"]
  Build --o Out2["audit: build-handoff /<br/>build-plan-resolved /<br/>file-edit /<br/>compliance-re-evaluated"]
  Deploy --o Out3["audit: deploy-promoted /<br/>deploy-aborted /<br/>ac-changed-test-regenerated"]
  CompReg --o Out4["audit: companion-registered"]
  Out1 --> Outbox["per-service outboxes"]
  Out2 --> Outbox
  Out3 --> Outbox
  Out4 --> Outbox
  Outbox -->|SKIP LOCKED poll| Cons["Audit Consumer"]
  Cons --> Ledger["audit_ledger<br/>(hash chain)"]
  Ledger -->|hourly| Anchor["WORM Anchor<br/>Azure Blob Compliance Mode"]
```

Single-megaworkflow-spans-project-lifecycle is rejected; per-phase
fits DBOS's natural shape and gives each phase its own retry /
error-handling story (per ORCH-2).

### 9.3 Hand-off envelopes (per RUNTIME-7)

Hand-off envelopes are the only way one phase invokes the next.
Each carries the locked inputs the next phase needs and is recorded
as an audit event:

| Hand-off | Envelope contents | Audit kind |
| --- | --- | --- |
| Spec → Build | frozen spec hash, signed approval ID, resolved `build-plan.lock` content hash | `build-handoff` |
| Build → Deploy | frozen spec hash, signed approval ID, build N, lockfile hash, image digest | `deploy-handoff` |
| Deploy → Companion-register | build N, env, deployment ID, opt-in flag | `companion-handoff` |

The Build Agent reads only from the Spec → Build envelope; references
outside it are rejected. Bare-database-state-machine and approval-ID-
only hand-offs are rejected because they don't bind the resolved
build plan to the approval (per RUNTIME-7).

### 9.4 Continuous compliance probing

Hybrid event-triggered + scheduled (per COMPLY-1). Probes run on
event signals (skill version change, data-source schema change,
deploy completion) for fast feedback, with a 6h scheduled timer as
backstop. Probes are AC-tagged k6 jobs running against deployed
apps. Failures recompute the compliance score and emit audit events.

### 9.5 KB promotion lifecycle

User-initiated promotion with three scope levels: private → team →
org-wide (per KB-PROMOTION-1). Org admins can demote or remove.
Cross-org promotion rejected.

### 9.6 Fork lineage

A forked project carries a `forkedFromProjectId` lineage edge for
audit traversal. Spec content + governance role assignments are
inherited; build / deploy / approvals / KB reset (per
FORK-LINEAGE-1).
