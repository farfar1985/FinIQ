## 10. Observability and audit

### 10.1 Logging, tracing, metrics

Self-hosted Grafana stack in `amira-platform` (per OBS-3): Loki for
logs, Tempo for traces, Mimir for metrics. OpenTelemetry collector
runs as a DaemonSet in both clusters and forwards to the stack.
Azure Monitor / Application Insights / Log Analytics are rejected
on cloud-portability grounds.

LLM-call telemetry is OpenTelemetry middleware emitting spans tagged
with `(orgId, userId, projectId, agentRole, callType, model,
cached-read, cache-write, uncached, latency, status)` (per LLM-4).
Spans land in Tempo; aggregations build per-org / per-project /
per-agent / per-call-type cost + latency views (also surfaced in
billing / Settings UI).

### 10.2 Trace store, redaction, and audit-bound view

Tool-call results land in Tempo with content redaction tags applied
to PII / RLS-marked rows before LLM context (per CROSS-6 follow-up,
LLM-5). The LLM sees the redacted view; the trace store retains
the full content but engineers see only the redacted view by default.
Audit-bound roles can request the un-redacted view; the request
itself is an audit event. The trace store's retention is separate
from the 7-year audit-ledger window (default; revisit if constraints
change).

### 10.3 Per-route SLIs and NFR compliance

Live per-route SLIs computed from OpenTelemetry spans (P50 / P95
first-token, dashboard load, voice end-to-end, errors per 1k) per
LLM-4 schema (per OBS-2). k6 scheduled probes every 6h (per
COMPLY-1) for AC-tagged compliance NFR checks against deployed apps.
Breaches trigger alerts and emit audit events.

### 10.4 Audit ledger and immutability

**Substrate** — Hash-chained Postgres ledger + Azure Blob Immutable
Compliance Mode as the WORM Merkle anchor (per AUDIT-1, PERSIST-2 +
AUDIT-1).

- Each ledger row stores `prev_hash + row_hash`. The chain is
  intrinsically serial — one writer, regardless of how many
  consumers feed it.
- Hourly job reads the chain tip, computes the Merkle root, writes
  it to Azure Blob Immutable Compliance Mode in QDT's subscription.
  The anchor digest is recorded as the next ledger row's hash input.
- 7-year retention is enforced by Azure Blob's locked policy;
  retention can be extended but not shortened.
- The immutability cannot be overridden by Microsoft support, by
  QDT operators, or by anyone (per AUDIT-1).
- An external regulator audit is satisfied by handing over the
  ledger export + the anchor blob set; chain integrity is verifiable
  end-to-end. SEC 17a-4(f) / FINRA 4511(c) / CFTC 1.31(c)
  defensible.

EventStoreDB and distributed-ledger products are rejected as
operational overhead with no compliance benefit. MinIO self-hosted
is rejected. Public anchor publication is not a v1 feature; revisit
only if a regulator or customer specifically asks (per PERSIST-2 +
AUDIT-1).

### 10.5 Audit attribution

Three-field actor (`userId`, `agentId`, `serviceId`, any nullable
per kind with per-kind validator) + `causedBy` UUID pointer +
`(orgId, projectSeq)` for intra-project ordering (per AUDIT-2).
Causation DAG stored as parent-pointer chain in Postgres (UUID
column, indexed); traversal via recursive CTE. No separate graph
database. Wire format between services is RFC 8693 `act`-chain,
capped at 6 elements.

Audit kinds are an extensible schema. The platform ships with a
representative seed set of kinds (e.g., `spec-edit`, `approval-signed`,
`build-plan-resolved`, `deploy-promoted`); the schema itself is
open-ended, with a per-kind validator registry that operators extend
as new event types appear. The seed set is a starting point, not a
ceiling.

### 10.6 Correlation: a single user action threading through every component

When a user fires "lock spec for e-signature" in Canvas:

1. Platform API receives the request with session identity → emits
   audit `userId=user, agentId=null, serviceId=platform-api,
   kind=spec-lock-requested, causedBy=null`.
2. Spec Agent runtime exchanges the user's token via OBO → emits
   audit `userId=user, agentId=spec, serviceId=spec-runtime,
   kind=spec-locked, causedBy=spec-lock-requested`.
3. Approval routing notifies the authorized approver → emits audit
   `agentId=null, serviceId=approval-router,
   kind=approval-routed, causedBy=spec-locked`.
4. Approver e-signs → audit `userId=approver, serviceId=approval-ui,
   kind=approval-signed, causedBy=approval-routed`.
5. Build Agent receives hand-off envelope → audit `agentId=build,
   kind=build-handoff, causedBy=approval-signed`.
6. … and so on through `build-plan-resolved`, `file-edit`,
   `deploy-handoff`, etc.

Recursive-CTE traversal of the `causedBy` DAG retrieves the entire
thread. Per-project monotonic `projectSeq` orders events deterministically
within a project. The `act`-chain on the wire format carries the
delegation chain through external systems.

## 11. Kubernetes topology

### 11.1 Two-cluster split

Two AKS clusters in QDT's Azure subscription (per DEPLOY-2 / DEPLOY-1):

#### `amira-platform` cluster

- **Runs:** Platform API + UI server, Agent runtime worker pods,
  DBOS scheduler / queue runner, Skill Catalog service, Platform IdP
  client, OPA, Audit Consumer, WORM Anchor scheduled job, Grafana /
  Loki / Tempo / Mimir, OpenTelemetry collector DaemonSet,
  external-secrets-operator, cert-manager, external-dns, nginx
  ingress.
- **Termination:** `amira.qdt.ai` (platform UI, API, SSE).

#### `amira-workloads` cluster

- **Runs:** `agent-sandbox` CRD controller + warm pools, Argo
  Rollouts controller, Buildkit pod, deployed customer-app pods,
  companion-agent MCP-server pods, OpenTelemetry collector DaemonSet,
  external-secrets-operator, cert-manager, external-dns, nginx
  ingress.
- **Termination:** `*.apps.amira.qdt.ai` (deployed apps + previews).

The two clusters are connected via Azure VNet peering. The platform
cluster's DBOS workflow drives the workloads cluster's Argo Rollouts
and `agent-sandbox` resources through the workloads cluster's
Kubernetes API over the peered network.

### 11.2 Namespaces

#### In `amira-platform`

- `platform-system` — control-plane services, OPA, IdP integration.
- `platform-data` — Audit Consumer, WORM Anchor job, DBOS workers,
  external-secrets-operator.
- `observability` — Grafana / Loki / Tempo / Mimir.
- `ingress-system` — nginx ingress controller, cert-manager,
  external-dns.

#### In `amira-workloads`

- `sandbox-system` — `agent-sandbox` CRD controller, warm-pool
  managers.
- `sandbox-<sessionId>` — short-lived sandbox-pod namespaces
  created per Build / Preview / Repo-import / Skill-dry-run session.
- `org-<orgId>-app-<appId>-<env>` (env ∈ `{dev, uat, prod}`) —
  one namespace per app per environment for deployed apps and their
  companion-agent MCP servers.
- `argo-rollouts` — Argo Rollouts controller.
- `image-build` — Buildkit pod.
- `ingress-system` — nginx ingress, cert-manager, external-dns.

### 11.3 Per-namespace controls (workloads cluster)

Every `sandbox-*` and `org-*-app-*-<env>` namespace runs:

- **`NetworkPolicy` default-deny** plus explicit egress allows for:
  Artifactory, ACR (image pull), Azure Key Vault (via
  external-secrets-operator), the Postgres + LLM-adapter endpoints
  (only for control-plane-marked services), and the spec-derived
  egress allowlist (per CROSS-4 layer 4 — for deployed apps).
- **Pod Security Standards `restricted` profile.**
- **`ResourceQuota`** sized per app's tier and per environment.
- **`RuntimeClass`** = Kata-Firecracker for every pod.
- **External-secrets-operator sidecar** for Key Vault-backed
  secret resolution.

### 11.4 Tenant isolation enforcement

Tenant isolation enforces in two planes:

- **Data plane:** Postgres RLS keyed by `org_id` + Snowflake-style
  immutable session attributes set on every connection (per
  PERSIST-5).
- **Network plane:** namespace-per-org-per-app + NetworkPolicy
  default-deny in `amira-workloads` (per DEPLOY-2).

Cross-environment data leakage is therefore blocked twice (per
DEPLOY-2). For BU boundaries, the same RLS engine adds a
`workspace_id` predicate; for per-customer (when the dedicated
customer-installed deployment tier ships) the boundary is the
deployment itself, not a code path inside one platform.

### 11.5 Per-pod resource profile sketches

(default; revisit once dogfood telemetry exists)

| Pod class | vCPU | Memory | Notes |
| --- | --- | --- | --- |
| Platform API | 2 | 4 GB | Multiple replicas behind Service |
| Agent runtime worker | 4 | 8 GB | Long-running; per-session memory dominated by Claude Agent SDK context cache |
| DBOS worker | 2 | 4 GB | Stateless poll/exec |
| Skill Catalog | 2 | 4 GB | Read-mostly |
| Audit Consumer | 1 | 2 GB | Single-writer; backpressure-tolerant |
| Sandbox (Next.js + FastAPI) | 2 | 4 GB | Kata microVM; tunable per pool |
| Deployed app | 1–4 | 2–8 GB | Per app's Helm values |
| Companion MCP | 1 | 2 GB | One per source app |
| Buildkit | 4 | 8 GB | Burst |
| OpenTelemetry collector | 1 | 2 GB | DaemonSet |

### 11.6 Secrets and persistent volumes

Secrets reach pods via external-secrets-operator pulling from Azure
Key Vault. Persistent volumes are minimized: Postgres is managed
(no PV); Loki / Tempo / Mimir use Azure Blob-backed object storage
where supported, falling back to managed-disk PVs for Mimir's local
ingester and Tempo's WAL (default; revisit). Sandbox pods are
ephemeral; deployed apps are stateless except for app-owned data
in their per-app database (provisioning model open per PERSIST-1
follow-up).

## 12. Local development

The local stack is a `docker-compose` topology that mirrors
production component-for-component, with the goal that a developer
can clone the repo, run `make dev`, and have a functional Amira on
localhost without Azure access.

### 12.1 docker-compose stack (production parity)

| Service | Local impl | Production equivalent |
| --- | --- | --- |
| Postgres + pgvector | `pgvector/pgvector:pg16` container | Azure Database for PostgreSQL Flexible Server |
| Object storage | MinIO | Azure Blob Storage (S3-compatible) |
| Secret store | Local file-backed shim emulating external-secrets-operator | Azure Key Vault |
| Container registry | Local Docker registry | Azure Container Registry |
| Dependency mirror | Verdaccio (npm) + devpi (PyPI) | JFrog Artifactory |
| Sandbox runtime | Plain Docker containers (no Kata) | Kata-Firecracker on AKS |
| Workflow engine | DBOS Python (same package, against local Postgres) | DBOS on managed Postgres |
| Argo Rollouts | Skipped — `helm install` direct | Argo Rollouts on `amira-workloads` |
| Ingress | Caddy (local TLS) | nginx + cert-manager + Let's Encrypt |
| Identity | Local OIDC mock (mock-oauth2-server) | Auth0 / WorkOS / customer IdP |
| LLM provider | Anthropic API direct via `ANTHROPIC_API_KEY` | Anthropic API (or Bedrock / Vertex / Foundry) |
| OpenTelemetry stack | Grafana single-container dev image | Grafana / Loki / Tempo / Mimir self-hosted |
| Skill curation scanners (Socket / Snyk / Trivy / dry-run) | Skipped at install time; `make scan` runs the same scanners on demand | Inline at every install / promotion |

### 12.2 Mocked production features (and why)

- **Kata-Firecracker isolation** — replaced with plain Docker
  containers locally (developers don't run AKS Pod Sandboxing on a
  laptop). Trade-off: local sandboxes share the host kernel; suitable
  for development, never for production code execution.
- **Azure Blob Immutable Compliance Mode** — replaced with MinIO
  (no immutability lock). Local audit chain still hash-chains rows,
  but the WORM property is absent. Audit-related tests pass against
  the chain integrity check; immutability tests run only against
  Azure.
- **External IdP federation** — replaced by a local mock OIDC server
  with seeded users + orgs. Federation handshakes (SAML, customer-IdP
  callbacks) are exercised via integration tests in CI, not local
  dev.
- **Argo Rollouts BlueGreen** — `make dev` does `helm install`
  directly; deploy gating + AC-runner runs but without the
  `prePromotionAnalysis` Service-selector flip. Local "deploy"
  produces a running app accessible at `<app>.localtest.me` (which
  resolves to 127.0.0.1).
- **Cross-cluster VNet peering** — collapsed: both `amira-platform`
  and `amira-workloads` workloads run in the same compose network.
  The VNet boundary is exercised in CI / staging, not locally.
- **Skill curation scanners (Socket / Snyk / Trivy / Sigstore /
  dry-run)** — disabled at the local install gate to keep `make dev`
  fast; runnable on demand via `make scan`.

The local stack is sufficient to build the platform itself, exercise
the Spec → Build → Deploy pipeline, sign approvals, render the
Compliance Matrix, and ask companion agents questions. Anything that
specifically requires Azure-only behavior (immutability lock, Pod
Sandboxing, Entra ID federation) is exercised in a CI staging
environment that runs against actual Azure.

### 12.3 Seed data

`make seed` loads a representative set of fixtures (sample projects,
governance assignments, audit records) so every local dev environment
starts in a consistent, demonstrable state.

## 13. Customer-environment deployment model

Amira's v1 architectural default is multi-tenant SaaS at
`amira.qdt.ai` (per MTEN-1). A dedicated customer-installed
deployment (e.g., Mars-Amira inside Mars's Azure subscription) is
the **enterprise commercial tier** — same code, different deployment
configuration — and is **out of scope for this iteration** but the
platform is built so the redeploy is a configuration change, not a
fork.

### 13.1 What gets reconfigured per deployment

| Surface | Reconfigured to | Default in QDT-hosted |
| --- | --- | --- |
| **Platform IdP** | Customer's IdP (Mars Entra ID / Okta / etc.) — drives users + roles directly; no federation needed | Auth0 / WorkOS (federates from each customer org's IdP) |
| **LLM provider** | Customer-configured via the env-var-toggle adapter — Anthropic direct, Azure OpenAI in customer subscription, AWS Bedrock, Google Vertex, Microsoft AI Foundry, or on-prem (per LLM-6) | Anthropic API direct |
| **Customer data sources** | Customer's data lakes (Mars QDL / QML / Q-* via Skill MCP adapters) | Demo data only |
| **Skill catalog `deployment-proprietary` tier** | Customer-admin signing key; customer-published skills (e.g., Mars's QDL/QML skills) | QDT-admin key + QDT release skills |
| **Container registry** | Customer's ACR or equivalent | QDT's ACR |
| **Object storage** | Customer's Azure Blob (or other S3-compatible) in customer subscription | QDT's Azure Blob |
| **Postgres** | Customer's Azure Database for PostgreSQL (or equivalent managed Postgres) | QDT's instance |
| **Secret store** | Customer's Key Vault (with customer's signing chains) | QDT's Key Vault |
| **DNS / hostnames** | Customer-chosen domain (e.g., `amira.mars.com`); per-app subdomain pattern preserved or replaced with per-app sub-path; cert authority configurable (Let's Encrypt or customer internal CA) | `amira.qdt.ai`; `*.apps.amira.qdt.ai` |
| **Dependency mirror** | Customer's curated Artifactory / Nexus | QDT's Artifactory |
| **Observability** | Customer-side Grafana stack (or routed via OpenTelemetry to a backend of customer choice) | QDT's self-hosted Grafana |

### 13.2 What stays the same

- Two-cluster split (platform + workloads).
- Postgres + pgvector schema, RLS rules, immutable session attribute
  pattern.
- Hash-chained audit ledger + WORM Merkle anchor pattern
  (Azure Blob Immutable Compliance Mode is the reference, but any
  WORM-compliant object store satisfies the contract).
- DBOS workflow engine, Claude Agent SDK runtime, MCP skill format
  with Amira manifest overlay.
- `agent-sandbox` CRD with Kata-Firecracker, warm pools.
- Helm + Argo Rollouts BlueGreen deploy with AC-runner +
  `prePromotionAnalysis`.
- OBO via RFC 8693 Token Exchange; three-field actor + `causedBy`
  audit attribution.
- Spec capability graph + Compliance Matrix re-evaluation.
- Per-tenant config record (per MTEN-2) loaded at session start —
  in a single-tenant deployment the config simply has one tenant.

### 13.3 What isn't supported

- **License enforcement, feature-gating, tier-based entitlement** —
  the platform has no runtime license-key check, no feature flag
  tied to a license tier, no expiration-triggered read-only mode,
  no phone-home enforcement (per 00-context.md). Entitlement is
  governed contractually. If AMS lapses the customer keeps a
  working perpetual build but stops receiving updates.
- **Per-user BYOK** — v1 only supports per-org BYOK (per LLM-6).
- **Subscription-OAuth proxy** for LLMs — permanently rejected (per
  LLM-6, Anthropic Feb 2026 ToS).
- **Cloud lock-in to Azure** — the platform runs on AKS today and
  should remain portable to other Kubernetes flavors with a
  configuration change. Avoiding Azure-Monitor / Application
  Insights / Log Analytics is the structural reason the
  observability stack is Grafana-based (per OBS-3).
- **Local-agent topology** (user runs the agent on their own
  machine) — out of scope (per 00-context.md / LLM-6 option 4).

### 13.4 Deployment-time configuration registry

A per-deployment + per-org config record (per MTEN-2) is loaded at
session start and supplies: skills allowlist, governance roles,
vocabulary, compliance standards, prompt fragments, audit kinds.
Tenant-specific tools install through the skill catalog's
`deployment-proprietary` tier (per SKILL-3). Fork-driven customization
is rejected.

## 14. Open architectural risks

Risks the platform is choosing not to solve in v1, why that's safe
for now, and what would force a revisit.

### 14.1 Single-Postgres concentration

One Postgres family carries application state, DBOS workflow state,
audit outboxes, and the audit ledger. A Postgres outage is a
platform-wide outage.

**Why safe** — Azure Database for PostgreSQL Flexible Server with
geo-redundant backup + point-in-time restore is a managed substrate
operated by Microsoft. v1 expected concurrency (Mars-rollout scale,
~200–500 events/sec peak per ORCH-1) is an order of magnitude under
the chain-write ceiling. RUNTIME-1 picked DBOS-on-shared-Postgres
specifically to keep operational surface low.

**Trigger to revisit** — Sustained chain-write throughput >1k
events/sec for a rolling 24h window (WAL-tail migration), or
approach to ~5k events/sec (per-project chain sharding). For
workflow workload: separate the DBOS Postgres from the audit
Postgres if the triple-workload contention surfaces.

### 14.2 Single audit consumer

One global Audit Consumer in v1 (per ORCH-1). Consumer outage delays
audit visibility for every project.

**Why safe** — The hash chain is intrinsically serial (one writer
to the chain). Consumer outage doesn't block business writes; only
audit visibility lags. SKIP LOCKED degrades gracefully.

**Trigger to revisit** — Sustained backpressure or consumer
operational fragility. Migration is partition-key-per-consumer,
not architectural redesign.

### 14.3 Single-agent ReAct loop without verifier

Day-one Build Agent runs single-agent without a verifier sub-agent
(per AGENT-TOPO-1). Compliance re-eval shares context budget with
the main loop.

**Why safe** — Cheaper, fewer moving parts. Compliance Matrix
re-eval is bounded; published research shows verifier sub-agents
help mostly when error rates are unacceptable.

**Trigger to revisit** — Compliance re-eval starves the main
loop's context budget (measured), or single-agent error rate is
unacceptable on dogfood metrics.

### 14.4 Forward-only rollback in v1.0

v1.0 ships forward-only rollback (`helm rollback <release> <revision>`).
v1.5 adds Argo Rollouts BlueGreen + paired companion-agent version-pin
flip atomicity (per DEPLOY-5).

**Why safe** — Helm release history is preserved per app.
Forward-only is acceptable when ACs gate every promotion.

**Trigger to revisit** — Customer requirement for atomic rollback,
or operational pain from manual companion-agent re-pin.

### 14.5 Public anchor publication not implemented

Audit anchor is sealed in Azure Blob Immutable Compliance Mode in
QDT's subscription, but not published to a public transparency log.

**Why safe** — Cohasset-assessed Azure Blob Compliance Mode meets
SEC 17a-4(f) / FINRA 4511(c) / CFTC 1.31(c) without public
publication.

**Trigger to revisit** — A regulator or customer specifically asks
for public verifiability.

### 14.6 Single greenfield stack (Next.js + FastAPI)

v1 commits to one stack for full Build Agent capability (per
BUILD-1). Imported repos in non-Next/FastAPI stacks are
host-only (degraded experience).

**Why safe** — Lovable-style narrow lock-in is the deliberate
quality trade. The cost to add a stack is bounded (~1 dev-month).

**Trigger to revisit** — A paying customer requires a different
greenfield stack.

### 14.7 Per-user BYOK deferred

v1 supports per-org BYOK only (per LLM-6). Per-user BYOK is a
future feature.

**Why safe** — Org-level BYOK matches the org-as-tenant model
(MTEN-1) and covers the volume-economics use case.

**Trigger to revisit** — Power-user demand for per-user keys, or
org-level BYOK proves operationally awkward.

### 14.8 No multi-LLM-provider in v1

The LLM adapter exposes Anthropic-family models only in v1; OpenAI
/ Gemini / others are Phase 2 (per LLM-6).

**Why safe** — Anthropic models cover Build Agent quality. The
adapter shape (env-var-toggle) preserves the option without code
change.

**Trigger to revisit** — A customer specifically requires another
provider, or model-quality gap on a target task.

### 14.9 Dedicated customer-installed deployment is parallel offering

The dedicated customer-installed enterprise tier (Mars-Amira inside
Mars's Azure subscription) remains available but is **out of scope
for this iteration** (per MTEN-1). Multi-tenant SaaS is the v1
default.

**Why safe** — Same code, different deployment configuration. The
platform is built so the redeploy is a configuration change, not a
fork (§13).

**Trigger to revisit** — Commercial demand validates the dedicated
tier; until then, the SaaS shape is the priority.

### 14.10 Companion-agent prompt customization not user-editable in v1

v1 ships pure-auto companion-agent synthesis (per AGENT-1
follow-ups). Explicit prompt customization is Phase 2.

**Why safe** — Synthesis from spec FRs + ACs covers the demo and
early production cases. Hand-edit creates an ownership question
about the SKILL.md across deploys.

**Trigger to revisit** — Customer demand for branded / customized
companion-agent voice.

### 14.11 Time-travel UI in Canvas deferred

Per-build snapshots / checkpoints surface in Canvas as a time-travel
UI is Phase 2 (per BUILD-4 follow-ups). The CAS layer + Git tagging
already store the necessary data.

**Why safe** — Build-session checkpoints preserve work; Git tags
and repo browsing cover the recovery use case.

**Trigger to revisit** — User research surfaces strong demand.

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>

<script>
(function () {
  'use strict';

  // ---- Helpers ----
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function stripTags(s) { return String(s).replace(/<[^>]*>/g, ''); }
  function slugify(text) {
    return String(text).toLowerCase().trim()
      .replace(/[^\w\s.\-]/g, '')
      .replace(/[\s.]+/g, '-')
      .replace(/-+/g, '-')
      .replace(/^-+|-+$/g, '');
  }
  function debounce(fn, wait) {
    let t; return function () { clearTimeout(t); t = setTimeout(() => fn.apply(this, arguments), wait); };
  }

  // ---- DOMPurify config: permissive for trusted authored markdown but blocks scripts/iframes/etc. ----
  const sanitize = (html) => DOMPurify.sanitize(html, {
    ADD_ATTR: ['target', 'loading', 'referrerpolicy', 'class', 'id'],
    FORBID_TAGS: ['script', 'iframe', 'object', 'embed', 'form'],
    FORBID_ATTR: ['onerror', 'onload', 'onclick']
  });
  const sanitizeSvg = (svg) => DOMPurify.sanitize(svg, {
    USE_PROFILES: { svg: true, svgFilters: true, html: true },
    ADD_TAGS: ['style', 'foreignObject', 'use', 'switch'],
    ADD_ATTR: ['xmlns', 'xmlns:xlink', 'xlink:href', 'style', 'class', 'id', 'transform',
               'd', 'viewBox', 'preserveAspectRatio', 'fill', 'stroke', 'stroke-width',
               'stroke-dasharray', 'stroke-linecap', 'stroke-linejoin', 'stroke-miterlimit',
               'font-family', 'font-size', 'font-weight', 'font-style',
               'text-anchor', 'dominant-baseline', 'alignment-baseline',
               'x', 'y', 'cx', 'cy', 'r', 'rx', 'ry', 'x1', 'y1', 'x2', 'y2',
               'width', 'height', 'requiredExtensions', 'marker-end', 'marker-start',
               'opacity', 'fill-opacity', 'stroke-opacity', 'color']
  });

  // ---- Markdown source ----
  const mdRaw = document.getElementById('md-source').textContent;

  // ---- Marked configuration ----
  const renderer = new marked.Renderer();

  const origHeading = renderer.heading.bind(renderer);
  renderer.heading = function (text, level, raw) {
    const plain = stripTags(typeof text === 'string' ? text : (raw || ''));
    const id = slugify(plain);
    return '<h' + level + ' id="' + escapeHtml(id) + '">' + text + '</h' + level + '>\n';
  };

  const origTable = renderer.table.bind(renderer);
  renderer.table = function (header, body) {
    return '<div class="table-scroll"><table>\n<thead>\n' + header + '</thead>\n<tbody>\n' + body + '</tbody>\n</table></div>\n';
  };

  renderer.code = function (code, infostring, escaped) {
    const lang = (infostring || '').match(/\S*/)[0];
    if (lang === 'mermaid') {
      return '<div class="mermaid-container"><div class="mermaid">' + escapeHtml(code) + '</div></div>\n';
    }
    const escaped_code = escaped ? code : escapeHtml(code);
    if (lang) return '<pre><code class="language-' + escapeHtml(lang) + '">' + escaped_code + '\n</code></pre>\n';
    return '<pre><code>' + escaped_code + '\n</code></pre>\n';
  };

  renderer.image = function (href, title, text) {
    const t = title ? ' title="' + escapeHtml(title) + '"' : '';
    return '<img src="' + escapeHtml(href) + '" alt="' + escapeHtml(text || '') + '"' + t + ' loading="lazy" />';
  };

  marked.setOptions({
    renderer: renderer,
    gfm: true,
    breaks: false
  });

  // ---- Render markdown ----
  const rawHtml = marked.parse(mdRaw);
  const safeHtml = sanitize(rawHtml);
  const article = document.getElementById('article');
  article.innerHTML = safeHtml;
  article.classList.add('reveal');

  // ---- Initialize Mermaid ----
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const mermaidVars = isDark ? {
    primaryColor: '#1A1814',
    primaryBorderColor: '#6BC4D0',
    primaryTextColor: '#ECE6D9',
    secondaryColor: '#211E18',
    tertiaryColor: '#14110D',
    lineColor: '#A39B8C',
    background: '#1A1814',
    mainBkg: '#1A1814',
    secondBkg: '#211E18',
    textColor: '#ECE6D9',
    nodeBorder: '#6BC4D0',
    clusterBkg: '#1F1C16',
    clusterBorder: '#423D31',
    edgeLabelBackground: '#1A1814',
    noteBkgColor: '#211E18',
    noteTextColor: '#ECE6D9',
    noteBorderColor: '#423D31',
    actorBkg: '#1A1814',
    actorBorder: '#6BC4D0',
    actorTextColor: '#ECE6D9',
    actorLineColor: '#A39B8C'
  } : {
    primaryColor: '#FFFFFF',
    primaryBorderColor: '#0F5560',
    primaryTextColor: '#1A1612',
    secondaryColor: '#F2EDE2',
    tertiaryColor: '#FAF8F3',
    lineColor: '#5E574B',
    background: '#FFFFFF',
    mainBkg: '#FFFFFF',
    secondBkg: '#F2EDE2',
    textColor: '#1A1612',
    nodeBorder: '#0F5560',
    clusterBkg: '#FAF8F3',
    clusterBorder: '#C9C0AB',
    edgeLabelBackground: '#FAF8F3',
    noteBkgColor: '#F2EDE2',
    noteTextColor: '#1A1612',
    noteBorderColor: '#C9C0AB',
    actorBkg: '#FFFFFF',
    actorBorder: '#0F5560',
    actorTextColor: '#1A1612',
    actorLineColor: '#5E574B'
  };

  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: Object.assign({
      fontFamily: 'Inter, -apple-system, BlinkMacSystemFont, sans-serif',
      fontSize: '13px'
    }, mermaidVars),
    flowchart: {
      useMaxWidth: false,
      htmlLabels: true,  // foreignObject xhtml survives via DOMParser path below
      curve: 'basis',
      padding: 14
    },
    sequence: {
      useMaxWidth: false,
      actorMargin: 60,
      messageMargin: 36,
      boxMargin: 12,
      noteMargin: 10,
      mirrorActors: false
    },
    securityLevel: 'loose'
  });

  // Render mermaid diagrams sequentially.
  // Parse SVG via DOMParser instead of innerHTML so foreignObject + xhtml labels survive
  // (DOMPurify's SVG profile strips xhtml inside foreignObject, which is where mermaid
  // puts node text). The mermaid input comes from our own md-source block, so the output
  // is trusted authored content; we still defensively strip any <script> nodes.
  const parser = new DOMParser();
  const stripUnsafe = (svgEl) => {
    svgEl.querySelectorAll('script').forEach(n => n.remove());
    svgEl.querySelectorAll('*').forEach(el => {
      [...el.attributes].forEach(attr => {
        const name = attr.name.toLowerCase();
        if (name.startsWith('on')) el.removeAttribute(attr.name);
        if (name === 'href' || name === 'xlink:href') {
          const v = (attr.value || '').trim().toLowerCase();
          if (v.startsWith('javascript:')) el.removeAttribute(attr.name);
        }
      });
    });
    return svgEl;
  };
  (async function renderMermaid() {
    const nodes = Array.from(document.querySelectorAll('.mermaid'));
    for (let i = 0; i < nodes.length; i++) {
      const node = nodes[i];
      const code = node.textContent;
      const id = 'mmd-' + i;
      try {
        const result = await mermaid.render(id, code);
        const doc = parser.parseFromString(result.svg, 'image/svg+xml');
        const svgEl = doc.documentElement;
        if (svgEl && svgEl.nodeName.toLowerCase() === 'svg') {
          stripUnsafe(svgEl);
          node.replaceChildren(svgEl);
        } else {
          throw new Error('Mermaid did not return an <svg> root');
        }
      } catch (err) {
        console.error('Mermaid render failed for diagram', i + 1, err);
        node.textContent = '';
        const pre = document.createElement('pre');
        pre.textContent = code;
        pre.style.cssText = 'text-align:left;font-family:var(--font-mono);font-size:12px;color:var(--text-muted);padding:12px;background:var(--surface-2);border-radius:6px;overflow:auto;';
        node.appendChild(pre);
      }
    }
    bindMermaidLightbox();
  })();

  // Inline any <img src="*.svg"> into the article so the SVG flows through the
  // canvas-style lightbox (drag, wheel zoom, pinch) instead of the simple image lightbox.
  // Lookup order: hidden <template id="svg-tpl-{basename}"> embedded at build time
  // (works offline / file://) → fetch() (works on http(s) and Safari file://).
  function svgTemplateFor(src) {
    const m = (src || '').match(/([^/]+)\.svg(?:[?#].*)?$/i);
    if (!m) return null;
    return document.getElementById('svg-tpl-' + m[1]);
  }
  async function loadSvg(src) {
    const tpl = svgTemplateFor(src);
    if (tpl && tpl.content) {
      // The browser already parsed the SVG inside the <template> using HTML's foreign-
      // content rules — clone that node directly. This sidesteps XML strictness around
      // bare `&` in text content (which would fail DOMParser's image/svg+xml mode).
      const inner = tpl.content.querySelector('svg');
      if (inner) return inner.cloneNode(true);
    }
    const res = await fetch(src);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const doc = parser.parseFromString(text, 'image/svg+xml');
    if (!doc.documentElement || doc.documentElement.nodeName.toLowerCase() !== 'svg' || doc.querySelector('parsererror')) {
      throw new Error('Not a valid <svg> root');
    }
    return doc.documentElement;
  }
  (async function inlineSvgImages() {
    const imgs = Array.from(article.querySelectorAll('img[src$=".svg"]'));
    for (const img of imgs) {
      try {
        const svgEl = await loadSvg(img.getAttribute('src'));
        stripUnsafe(svgEl);
        // Wrap in the same frame mermaid diagrams use, so the visual treatment matches.
        const container = document.createElement('div');
        container.className = 'mermaid-container';
        const inner = document.createElement('div');
        inner.className = 'mermaid';
        inner.appendChild(svgEl);
        container.appendChild(inner);
        const alt = img.getAttribute('alt');
        if (alt) container.setAttribute('aria-label', alt);
        img.replaceWith(container);
        inner.addEventListener('click', () => openLightbox(svgEl));
      } catch (err) {
        console.error('Inline SVG failed for', img.src, err);
      }
    }
  })();

  // ---- Build TOC from h2 + h3 ----
  function buildToc() {
    const tocList = document.getElementById('tocList');
    const headings = article.querySelectorAll('h2, h3');
    let currentH2Sublist = null;

    headings.forEach((h) => {
      const level = h.tagName === 'H2' ? 2 : 3;
      const id = h.id || slugify(h.textContent);
      h.id = id;

      const text = h.textContent.trim();
      const numMatch = text.match(/^(\d+(?:\.\d+)*)\.?\s+(.+)$/);

      if (level === 2) {
        const li = document.createElement('li');
        li.className = 'toc-h2';
        li.dataset.target = id;

        const a = document.createElement('a');
        a.href = '#' + id;

        if (numMatch) {
          const numSpan = document.createElement('span');
          numSpan.className = 'toc-num';
          numSpan.textContent = numMatch[1];
          const txtSpan = document.createElement('span');
          txtSpan.className = 'toc-text';
          txtSpan.textContent = numMatch[2];
          a.appendChild(numSpan);
          a.appendChild(txtSpan);
        } else {
          const txtSpan = document.createElement('span');
          txtSpan.className = 'toc-text';
          txtSpan.textContent = text;
          a.appendChild(txtSpan);
        }
        li.appendChild(a);

        const sub = document.createElement('ul');
        li.appendChild(sub);
        tocList.appendChild(li);
        currentH2Sublist = sub;
      } else if (level === 3 && currentH2Sublist) {
        const li = document.createElement('li');
        li.className = 'toc-h3';
        li.dataset.target = id;
        const a = document.createElement('a');
        a.href = '#' + id;
        const txtSpan = document.createElement('span');
        txtSpan.className = 'toc-text';
        txtSpan.textContent = numMatch ? numMatch[2] : text;
        a.appendChild(txtSpan);
        li.appendChild(a);
        currentH2Sublist.appendChild(li);
      }
    });
  }
  buildToc();

  // ---- Smooth scroll on TOC click ----
  document.getElementById('tocList').addEventListener('click', function (e) {
    const a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    const id = a.getAttribute('href').slice(1);
    const target = document.getElementById(id);
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', '#' + id);
    }
    closeSidebar();
  });

  // ---- Scrollspy ----
  function setupScrollspy() {
    const sections = Array.from(article.querySelectorAll('h2, h3'));
    const tocLinks = document.querySelectorAll('#tocList li');
    if (!sections.length) return;

    const visible = new Set();
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) visible.add(entry.target.id);
        else visible.delete(entry.target.id);
      });

      let activeId = null;
      sections.forEach((s) => {
        if (!activeId && visible.has(s.id)) activeId = s.id;
      });
      if (!activeId) {
        const scrollY = window.scrollY + 80;
        sections.forEach((s) => {
          if (s.offsetTop <= scrollY) activeId = s.id;
        });
      }

      tocLinks.forEach((li) => li.classList.toggle('active', li.dataset.target === activeId));
      if (activeId) {
        const activeLi = document.querySelector('#tocList li[data-target="' + CSS.escape(activeId) + '"]');
        if (activeLi && activeLi.classList.contains('toc-h3')) {
          const parent = activeLi.closest('.toc-h2');
          if (parent) parent.classList.add('active');
        }
      }
    }, {
      rootMargin: '-15% 0px -70% 0px',
      threshold: 0
    });

    sections.forEach((s) => observer.observe(s));
  }
  setupScrollspy();

  // ---- Mobile sidebar toggle ----
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const menuBtn = document.getElementById('menuToggle');

  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('open');
    menuBtn.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }
  menuBtn.addEventListener('click', () => {
    if (sidebar.classList.contains('open')) closeSidebar(); else openSidebar();
  });
  overlay.addEventListener('click', closeSidebar);

  // ---- Lightbox ----
  const lightbox = document.getElementById('lightbox');
  const lightboxContent = document.getElementById('lightboxContent');
  const lightboxToolbar = document.getElementById('lightboxToolbar');
  const lightboxZoomLabel = document.getElementById('lightboxZoomLabel');
  const lightboxZoomIn = document.getElementById('lightboxZoomIn');
  const lightboxZoomOut = document.getElementById('lightboxZoomOut');
  const lightboxZoomFit = document.getElementById('lightboxZoomFit');

  // Canvas-style pan + zoom for SVG diagrams (Figma/draw.io feel).
  // The stage is positioned at the lightbox-content's top-left and transformed via
  // `translate(panX, panY) scale(scale)`. Pan and zoom both work at any scale —
  // there's no native scrolling, so panning works even when the diagram is
  // smaller than the viewport.
  const ZOOM_MIN = 0.1;
  const ZOOM_MAX = 10;
  const ZOOM_STEP = 1.2;
  const WHEEL_SENSITIVITY = 0.0015;
  let zoomState = null; // { svg, stage, baseW, baseH, scale, panX, panY }

  function clamp(s) { return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, s)); }

  function applyTransform() {
    if (!zoomState) return;
    const { stage, panX, panY, scale } = zoomState;
    stage.style.transform = 'translate(' + panX + 'px, ' + panY + 'px) scale(' + scale + ')';
    lightboxZoomLabel.textContent = Math.round(scale * 100) + '%';
  }

  // Cursor-anchored zoom: keep the diagram point under the cursor pinned.
  function zoomAtPoint(newScale, clientX, clientY) {
    if (!zoomState) return;
    const oldScale = zoomState.scale;
    newScale = clamp(newScale);
    if (newScale === oldScale) return;
    const rect = lightboxContent.getBoundingClientRect();
    const cx = clientX - rect.left;
    const cy = clientY - rect.top;
    // Diagram-local point under cursor: (cx - panX) / scale.
    // After scaling, we want that point to stay at (cx, cy):
    //   newPanX = cx - localX * newScale = cx - (cx - panX) * (newScale/oldScale)
    const factor = newScale / oldScale;
    zoomState.panX = cx - (cx - zoomState.panX) * factor;
    zoomState.panY = cy - (cy - zoomState.panY) * factor;
    zoomState.scale = newScale;
    applyTransform();
  }

  function fitZoom() {
    if (!zoomState) return;
    const padX = 32, padY = 32;
    const cw = lightboxContent.clientWidth;
    const ch = lightboxContent.clientHeight;
    const availW = Math.max(100, cw - padX);
    const availH = Math.max(100, ch - padY);
    const fit = Math.min(availW / zoomState.baseW, availH / zoomState.baseH);
    // Boost for narrow/tall diagrams so labels are readable.
    const target = clamp(Math.max(fit, Math.min(1.6, fit * 1.4)));
    zoomState.scale = target;
    // Center the diagram.
    zoomState.panX = (cw - zoomState.baseW * target) / 2;
    zoomState.panY = (ch - zoomState.baseH * target) / 2;
    applyTransform();
  }

  function openLightbox(node) {
    while (lightboxContent.firstChild) lightboxContent.removeChild(lightboxContent.firstChild);
    lightboxContent.classList.remove('is-grab', 'is-grabbing');
    zoomState = null;
    if (node.tagName === 'IMG') {
      const clone = node.cloneNode(true);
      clone.style.cursor = 'default';
      clone.style.borderRadius = '0';
      clone.style.boxShadow = 'none';
      clone.style.border = '0';
      lightboxContent.appendChild(clone);
      lightboxToolbar.style.display = 'none';
    } else {
      const svg = node.tagName.toLowerCase() === 'svg' ? node : node.querySelector('svg');
      if (!svg) return;
      const clone = svg.cloneNode(true);
      clone.removeAttribute('style');

      let baseW = 0, baseH = 0;
      const vb = (clone.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
      if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
        baseW = vb[2]; baseH = vb[3];
      } else {
        baseW = parseFloat(clone.getAttribute('width')) || 0;
        baseH = parseFloat(clone.getAttribute('height')) || 0;
      }
      if (!baseW || !baseH) { baseW = 1200; baseH = 800; }
      if (!clone.getAttribute('preserveAspectRatio')) {
        clone.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      }
      // SVG fills the stage; the stage is the unit we transform.
      clone.setAttribute('width', baseW);
      clone.setAttribute('height', baseH);

      const stage = document.createElement('div');
      stage.className = 'lightbox-stage';
      stage.style.width = baseW + 'px';
      stage.style.height = baseH + 'px';
      stage.appendChild(clone);
      lightboxContent.appendChild(stage);
      lightboxToolbar.style.display = '';

      zoomState = { svg: clone, stage, baseW, baseH, scale: 1, panX: 0, panY: 0 };
      lightboxContent.classList.add('is-grab');
    }
    lightbox.hidden = false;
    document.body.style.overflow = 'hidden';
    if (zoomState) requestAnimationFrame(() => fitZoom());
  }
  function closeLightbox() {
    lightbox.hidden = true;
    document.body.style.overflow = '';
    while (lightboxContent.firstChild) lightboxContent.removeChild(lightboxContent.firstChild);
    lightboxContent.classList.remove('is-grab', 'is-grabbing');
    zoomState = null;
  }

  function viewportCenter() {
    const rect = lightboxContent.getBoundingClientRect();
    return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  }
  lightboxZoomIn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!zoomState) return;
    const c = viewportCenter();
    zoomAtPoint(zoomState.scale * ZOOM_STEP, c.x, c.y);
  });
  lightboxZoomOut.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!zoomState) return;
    const c = viewportCenter();
    zoomAtPoint(zoomState.scale / ZOOM_STEP, c.x, c.y);
  });
  lightboxZoomFit.addEventListener('click', (e) => { e.stopPropagation(); fitZoom(); });
  lightboxToolbar.addEventListener('click', (e) => e.stopPropagation());

  // Wheel = zoom (cursor-anchored). Works for mouse wheels and trackpad pinch.
  lightboxContent.addEventListener('wheel', (e) => {
    if (!zoomState) return;
    e.preventDefault();
    const px = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    const factor = Math.exp(-px * WHEEL_SENSITIVITY);
    zoomAtPoint(zoomState.scale * factor, e.clientX, e.clientY);
  }, { passive: false });

  // Drag = pan. Works at any zoom level (no native scroll required).
  let panState = null; // { startX, startY, startPanX, startPanY }
  lightboxContent.addEventListener('mousedown', (e) => {
    if (!zoomState) return;
    if (e.target.closest('.lightbox-toolbar') || e.target.closest('.lightbox-close')) return;
    if (e.button !== 0 && e.button !== 1) return;
    e.preventDefault();
    panState = {
      startX: e.clientX,
      startY: e.clientY,
      startPanX: zoomState.panX,
      startPanY: zoomState.panY
    };
    lightboxContent.classList.add('is-grabbing');
  });
  window.addEventListener('mousemove', (e) => {
    if (!panState || !zoomState) return;
    zoomState.panX = panState.startPanX + (e.clientX - panState.startX);
    zoomState.panY = panState.startPanY + (e.clientY - panState.startY);
    applyTransform();
  });
  function endPan() {
    if (!panState) return;
    panState = null;
    lightboxContent.classList.remove('is-grabbing');
  }
  window.addEventListener('mouseup', endPan);
  window.addEventListener('blur', endPan);
  lightboxContent.addEventListener('dragstart', (e) => e.preventDefault());

  // Touch: single-finger pan, two-finger pinch zoom.
  const activeTouches = new Map();
  let touchState = null; // { mode: 'pan'|'pinch', ... }
  lightboxContent.addEventListener('touchstart', (e) => {
    if (!zoomState) return;
    if (e.target.closest('.lightbox-toolbar') || e.target.closest('.lightbox-close')) return;
    e.preventDefault();
    for (const t of e.changedTouches) activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
    if (activeTouches.size === 1) {
      const t = [...activeTouches.values()][0];
      touchState = { mode: 'pan', startX: t.x, startY: t.y, startPanX: zoomState.panX, startPanY: zoomState.panY };
    } else if (activeTouches.size >= 2) {
      const [a, b] = [...activeTouches.values()];
      const dx = b.x - a.x, dy = b.y - a.y;
      touchState = {
        mode: 'pinch',
        startDist: Math.hypot(dx, dy),
        startScale: zoomState.scale,
        midX: (a.x + b.x) / 2,
        midY: (a.y + b.y) / 2
      };
    }
  }, { passive: false });
  lightboxContent.addEventListener('touchmove', (e) => {
    if (!zoomState || !touchState) return;
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (activeTouches.has(t.identifier)) activeTouches.set(t.identifier, { x: t.clientX, y: t.clientY });
    }
    if (touchState.mode === 'pan' && activeTouches.size === 1) {
      const t = [...activeTouches.values()][0];
      zoomState.panX = touchState.startPanX + (t.x - touchState.startX);
      zoomState.panY = touchState.startPanY + (t.y - touchState.startY);
      applyTransform();
    } else if (touchState.mode === 'pinch' && activeTouches.size >= 2) {
      const [a, b] = [...activeTouches.values()];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      const newScale = touchState.startScale * (dist / touchState.startDist);
      zoomAtPoint(newScale, touchState.midX, touchState.midY);
    }
  }, { passive: false });
  function touchEnd(e) {
    for (const t of e.changedTouches) activeTouches.delete(t.identifier);
    if (activeTouches.size === 0) touchState = null;
    else if (activeTouches.size === 1 && zoomState) {
      const t = [...activeTouches.values()][0];
      touchState = { mode: 'pan', startX: t.x, startY: t.y, startPanX: zoomState.panX, startPanY: zoomState.panY };
    }
  }
  lightboxContent.addEventListener('touchend', touchEnd);
  lightboxContent.addEventListener('touchcancel', touchEnd);

  function bindMermaidLightbox() {
    article.querySelectorAll('.mermaid').forEach((m) => {
      m.addEventListener('click', () => openLightbox(m));
    });
  }
  // Bind every image to the lightbox. SVG-href images may also be replaced by the
  // inline-SVG pass above; that just removes the <img> so this handler becomes a
  // harmless dangling listener. If the inline pass fails (e.g. file:// CORS in Chrome),
  // the <img> stays in place and this binding gives the user the image lightbox at least.
  article.querySelectorAll('img').forEach((img) => {
    img.addEventListener('click', () => openLightbox(img));
  });

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeSidebar();
      closeLightbox();
    }
    if (!lightbox.hidden && zoomState) {
      if (e.key === '+' || e.key === '=') {
        e.preventDefault();
        const c = viewportCenter();
        zoomAtPoint(zoomState.scale * ZOOM_STEP, c.x, c.y);
      } else if (e.key === '-' || e.key === '_') {
        e.preventDefault();
        const c = viewportCenter();
        zoomAtPoint(zoomState.scale / ZOOM_STEP, c.x, c.y);
      } else if (e.key === '0') {
        e.preventDefault();
        fitZoom();
      }
    }
  });

  // ---- Scroll progress ----
  const progress = document.getElementById('progress');
  function updateProgress() {
    const docH = document.documentElement.scrollHeight - window.innerHeight;
    const sc = window.scrollY;
    const pct = docH > 0 ? Math.min(100, (sc / docH) * 100) : 0;
    progress.style.width = pct + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', debounce(updateProgress, 100));
  updateProgress();

  // ---- Doc meta in footer ----
  const sectionCount = article.querySelectorAll('h2').length;
  const diagramCount = article.querySelectorAll('.mermaid-container').length;
  document.getElementById('docMeta').textContent =
    sectionCount + ' sections · ' + diagramCount + ' diagrams';

  // ---- Anchor on initial load ----
  if (location.hash) {
    setTimeout(() => {
      const t = document.getElementById(location.hash.slice(1));
      if (t) t.scrollIntoView({ behavior: 'instant', block: 'start' });
    }, 80);
  }
})();
</script>
</body>
</html>
